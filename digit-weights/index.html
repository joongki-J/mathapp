<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화소별 가중치로 숫자 구분하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* 배치: 한 줄 세로 흐름(데이터 → 손실함수 → 분류 결과 → 직접 그리기), 넓은 화면에서는 2단 */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#18212f; --sub:#5b6676; --line:#d5dbe4;
  --accent:#2b4acb; --one:#0f8a8a; --seven:#8a4fd3; --eight:#d9730d; --bad:#d0342c; --cell:#e6eaf0;
  --pix-on:#ffffff; --pix-off:#0e1116; --pix-grid:#444c5c; --pix-hl:#4f86ff;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-math:"STIX Two Text","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151c; --panel:#1a202a; --ink:#e8ecf2; --sub:#9aa5b5; --line:#313a48;
    --accent:#8ea4ff; --one:#3cc4c4; --seven:#c0a2ff; --eight:#f2a04a; --bad:#ff7b72; --cell:#283140;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151c; --panel:#1a202a; --ink:#e8ecf2; --sub:#9aa5b5; --line:#313a48;
  --accent:#8ea4ff; --one:#3cc4c4; --seven:#c0a2ff; --eight:#f2a04a; --bad:#ff7b72; --cell:#283140;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:14px}
header h1{font-size:22px;line-height:1.3;margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:var(--sub);max-width:62ch}
.cols{display:grid;gap:14px}
@media (min-width:820px){.cols{grid-template-columns:1fr 1fr;align-items:start}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0}
h2{font-size:16px;margin:0;display:flex;gap:8px;align-items:baseline}
h2 .n{font-family:var(--font-math);color:var(--accent);font-weight:600}
.note{color:var(--sub);font-size:13.5px;margin:0}
.m{font-family:var(--font-math);font-size:1.08em;white-space:nowrap}
.m i{font-style:italic}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;font-size:.92em}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
.formula{font-family:var(--font-math);font-size:17px;overflow-x:auto;padding:4px 0;white-space:nowrap}
.formula i{font-style:italic}
.num{font-variant-numeric:tabular-nums}

/* 학습 자료 */
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.s{border:1px solid var(--line);border-radius:8px;padding:6px 4px;display:grid;justify-items:center;gap:3px;font-size:12px;position:relative}
.s.d1{border-top:3px solid var(--one)} .s.d7{border-top:3px solid var(--seven)} .s.d8{border-top:3px solid var(--eight)}
.s.wrong{outline:2px solid var(--bad);outline-offset:1px}
.mini{display:grid;grid-template-columns:repeat(3,9px);gap:1px;background:var(--pix-grid);padding:1px;border-radius:2px}
.mini b{width:9px;height:9px;background:var(--pix-off)}
.mini b.on{background:var(--pix-on)}
.s .m{font-size:13px}
.s button{position:absolute;top:1px;right:2px;border:0;background:none;color:var(--sub);font-size:14px;line-height:1;padding:2px 4px;cursor:pointer}

/* 조작부 */
canvas{width:100%;height:230px;display:block;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.b{font:inherit;font-weight:600;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.b.p{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button.b:focus-visible,input:focus-visible,select:focus-visible,.cellbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:inherit;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.stat span{display:block;font-size:12px;color:var(--sub)}
.stat strong{font-size:15px}
.msg{font-size:13.5px;min-height:1.6em;margin:0}
.msg.warn{color:var(--bad);font-weight:600}

/* 분류 결과 수직선 */
.track{position:relative;height:92px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.zone8{position:absolute;top:0;bottom:0;right:0;background:color-mix(in srgb,var(--eight) 10%,transparent)}
.zone1{position:absolute;top:0;bottom:0;left:0;background:color-mix(in srgb,var(--one) 10%,transparent)}
.thr{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ink)}
.thr span{position:absolute;top:2px;left:4px;font-size:11px;white-space:nowrap}
.lane{position:absolute;left:0;font-size:11px;color:var(--sub);padding-left:4px}
.dot{position:absolute;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--panel)}
.dot.d1{background:var(--one)} .dot.d8{background:var(--eight)}
.dot.wrong{box-shadow:0 0 0 2px var(--bad)}
.dot.mine{background:var(--ink);border-radius:3px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;color:var(--panel)}
.pill.d1{background:var(--one)} .pill.d7{background:var(--seven)} .pill.d8{background:var(--eight)}

/* 직접 그리기 */
.draw{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,48px);gap:3px;touch-action:none;background:var(--pix-grid);padding:3px;border-radius:8px}
.cellbtn{width:48px;height:48px;border:0;border-radius:4px;background:var(--pix-off);cursor:pointer;padding:0}
.cellbtn.on{background:var(--pix-on)}
.out{display:grid;gap:6px;min-width:150px;flex:1}
@media (prefers-reduced-motion:no-preference){.dot{transition:left .25s}}

/* 가중치 지도 */
.wwrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.wmap{display:grid;grid-template-columns:repeat(3,56px);gap:4px}
.wcell{width:56px;height:46px;border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:0;font:inherit;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.wcell.sel{outline:3px solid var(--accent);outline-offset:1px}
.wcell:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:10px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;font-style:normal}
.side{flex:1;min-width:200px;display:grid;gap:8px}
canvas.small{height:120px}
.mini b{position:relative}
.mini b.hl{outline:2px solid var(--pix-hl);z-index:1}
.mini b.hl.on{background:#b9cdff}
.mini.big{grid-template-columns:repeat(3,13px)}
.mini.big b{width:13px;height:13px}
h3{font-size:14.5px;margin:6px 0 0}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:8px}
.term{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:4px;justify-items:start;font-size:12.5px}
.term.has{border-left-color:var(--accent)}
.term.none{color:var(--sub)}
.term .formula{font-size:16px;padding:0;color:var(--ink)}
.term.has .formula{color:var(--accent);font-weight:600}
.tag{font-size:11.5px;font-weight:600}
.st{display:block;line-height:1.45}
.st .lb{display:block;font-size:11px;color:var(--sub)}
.st .m{font-size:14.5px;white-space:normal}
#dSum{white-space:normal;line-height:1.9}
#myCalc{white-space:normal;font-size:15px}
.term.none .formula{color:var(--sub)}
.s{cursor:pointer}
.s.fed{background:color-mix(in srgb,var(--accent) 12%,var(--panel));box-shadow:0 0 0 2px var(--accent)}
.netwrap{display:flex;justify-content:center}
#net{width:100%;max-width:400px;height:auto;display:block}
#net text{font-family:var(--font-body);font-size:10.5px;fill:var(--ink);font-variant-numeric:tabular-nums}
#net .sub{fill:var(--sub)}
#net .wl{paint-order:stroke;stroke:var(--panel);stroke-width:3px}
#net .big{font-size:15px;font-weight:700}
#net g[data-k]{cursor:pointer}
.fedinfo{display:flex;gap:10px;align-items:center;font-size:13.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.maps{display:flex;gap:8px;flex-wrap:wrap}
.maps .mt{font-size:12px;font-weight:600;margin-bottom:3px;white-space:nowrap}
.maps.o3 .mt{font-size:10.5px}
.maps.o2 .wmap{grid-template-columns:repeat(3,46px)} .maps.o2 .wcell{width:46px;height:40px;font-size:12px}
.maps.o3 .wmap{grid-template-columns:repeat(3,31px);gap:3px} .maps.o3 .wcell{width:31px;height:30px;font-size:9.5px;border-radius:4px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:76px 1fr 92px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:14px;border-radius:7px;background:var(--cell);position:relative;overflow:hidden}
.bar .fl{position:absolute;top:0;bottom:0;border-radius:7px}
.bar.win{font-weight:700}
.fold{border:1px solid var(--line);border-radius:8px}
.fold{border-color:#2b4acb}
.fold summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:15px;color:#ffffff;background:#2b4acb;border-radius:7px}
.fold[open] summary{border-radius:7px 7px 0 0;margin-bottom:12px}
.fold summary .m{color:#ffffff}
.fold summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foldin{display:grid;gap:10px;padding:0 12px 12px;min-width:0}
[hidden]{display:none !important}
.axis2{position:relative;height:16px;font-size:11px;color:var(--sub)}
.axis2 span{position:absolute;transform:translateX(-50%)}
</style>
</head>
<body>
<main>
<header>
  <h1>화소별 가중치로 숫자 구분하기</h1>
  <div class="tabs" role="tablist" aria-label="장 선택" style="margin:8px 0">
    <button class="tab" type="button" role="tab" data-ch="0">1장 출력 노드 1개</button>
    <button class="tab" type="button" role="tab" data-ch="1">2장 출력 노드 2개</button>
    <button class="tab" type="button" role="tab" data-ch="2">3장 숫자 7 추가, 출력 노드 3개</button>
  </div>
  <p id="intro"></p>
</header>

<div class="cols">
<section aria-labelledby="h1">
  <h2 id="h1"><span class="n">1</span>학습 자료</h2>
  <p class="note" id="note1"></p>
  <div class="samples" id="samples"></div>
  <div class="row"><button class="b" id="resetData" type="button">처음 자료로 되돌리기</button></div>
</section>

<section aria-labelledby="hn">
  <h2 id="hn"><span class="n">2</span>인공신경망으로 나타내기</h2>
  <p class="note" id="note3"></p>
  <div class="fedinfo" id="fedinfo"></div>
  <div class="netwrap"><svg id="net" viewBox="0 0 346 392" role="img" aria-label="입력 노드 15개와 출력 노드로 이루어진 인공신경망"></svg></div>
  <div class="legend"><span><i style="background:var(--eight)"></i>양수 가중치</span><span><i style="background:var(--one)"></i>음수 가중치</span><span><i style="background:var(--accent)"></i>선택한 가중치</span><span>선이 굵을수록 절댓값이 큽니다</span></div>
  <p class="note" id="note3b"></p>
</section>
</div>

<div class="cols">
<section aria-labelledby="h3">
  <h2 id="h3"><span class="n">3</span>가중치 지도와 가중치 하나의 손실함수</h2>
  <p class="note" id="note4"></p>
  <div class="wwrap">
    <div>
      <div class="maps" id="maps"></div>
      <div class="legend" style="margin-top:6px" id="mapLegend"></div>
    </div>
    <div class="side">
      <div class="formula num" id="expanded"></div>
      <canvas id="chart" role="img" aria-label="선택한 가중치에 대한 손실함수의 그래프"></canvas>
      <label for="wRange" class="note" id="wLabel"></label>
      <input type="range" id="wRange" min="-0.6" max="0.8" step="0.01" value="0">
      <div class="stats num" style="grid-template-columns:1fr 1fr">
        <div class="stat"><span id="lblW"></span><strong id="vW"></strong></div>
        <div class="stat"><span>접선의 기울기</span><strong id="vD"></strong></div>
      </div>
      <div class="row"><button class="b" id="stepOne" type="button">이 가중치만 한 번 이동</button></div>
      <p class="msg num" id="msg2"></p>
    </div>
  </div>
  <details class="fold">
    <summary><span id="dTitle"></span> 펼쳐 보기</summary>
    <div class="foldin">
      <p class="note" id="dIntro"></p>
      <div class="terms" id="terms"></div>
      <div class="formula num" id="dSum"></div>
      <p class="note num" id="dWhy"></p>
    </div>
  </details>
</section>

<section aria-labelledby="h2">
  <h2 id="h2"><span class="n">4</span>모든 가중치 학습하기</h2>
  <div class="formula" id="form2"></div>
  <p class="note" id="note2"></p>
  <div class="stats num" style="grid-template-columns:repeat(3,1fr)">
    <div class="stat"><span>손실함수의 값</span><strong id="vL"></strong></div>
    <div class="stat"><span>이동 횟수</span><strong id="vN"></strong></div>
    <div class="stat"><span>맞게 판정</span><strong id="acc"></strong></div>
  </div>
  <canvas id="histc" class="small" role="img" aria-label="이동 횟수에 따른 손실함수 값의 변화"></canvas>
  <div class="row">
    <label for="eta">학습률 <span class="m"><i>η</i></span></label>
    <select id="eta">
      <option value="0.01" selected>0.01</option>
      <option value="0.02">0.02</option>
      <option value="0.05">0.05</option>
      <option value="0.1">0.1</option>
      <option value="0.2">0.2</option>
    </select>
    <button class="b p" id="stepAll" type="button"></button>
    <button class="b" id="auto" type="button">자동 실행</button>
    <button class="b" id="resetW" type="button">가중치를 모두 0으로</button>
  </div>
  <p class="msg num" id="msg"></p>
</section>
</div>

<div>
<section aria-labelledby="h4">
  <h2 id="h4"><span class="n">5</span><span id="h4t"></span></h2>
  <div id="trackBox">
    <div class="track" id="track"></div>
    <div class="axis2 num" id="axis2"></div>
  </div>
  <div class="draw">
    <div class="pad" id="pad" role="group" aria-label="3×5 그림판"></div>
    <div class="out">
      <div class="formula num" id="myCalc"></div>
      <div class="bars num" id="bars"></div>
      <div id="myVerdict"></div>
      <div class="row" id="addBtns"></div>
    </div>
  </div>
  <p class="note">학습 자료에 없던 모양도 그려 보세요. 틀리는 그림은 자료에 추가하고 다시 학습하면 가중치 지도가 달라집니다. 실제 손글씨 숫자 인식은 28×28 = 784개의 화소를 입력으로, 숫자 0~9에 맞춘 10개의 노드를 출력으로 둡니다.</p>
</section>
</div>
</main>

<script>
(function(){
  var RAW=[
    [".#.",".#.",".#.",".#.","...",1],
    [".#.",".#.",".#.",".#.",".#.",1],
    ["##.",".#.",".#.",".#.",".#.",1],
    [".#.",".#.",".#.",".#.","###",1],
    ["###","..#","..#","..#","..#",7],
    ["###","..#",".#.",".#.",".#.",7],
    ["###","#.#","..#","..#","..#",7],
    ["###","..#",".#.","#..","#..",7],
    ["###","#.#",".#.","#.#","###",8],
    [".##","#.#","###","#.#","###",8],
    ["###","#.#","###","#.#","###",8],
    ["###","###","###","#.#","###",8]
  ];
  var CH=[{classes:[1,8],single:true},{classes:[1,8],single:false},{classes:[1,7,8],single:false}];
  var DCOL={1:"var(--one)",7:"var(--seven)",8:"var(--eight)"};
  var TMIN=-0.25,TMAX=1.5,WMIN=-0.6,WMAX=0.8;
  var S=[],ci=0,cfg,cur,timer=null;
  var $=function(id){return document.getElementById(id)};
  function zeros(){var z=[];for(var i=0;i<15;i++)z.push(0);return z}
  function base(c){
    return RAW.filter(function(r){return c.classes.indexOf(r[5])>=0}).map(function(r){
      return {cells:r.slice(0,5).join("").split("").map(function(x){return x==="#"?1:0}),c:r[5],base:true};
    });
  }
  function nOut(){return cfg.single?1:cfg.classes.length}
  function firstOf(d){for(var i=0;i<cur.data.length;i++)if(cur.data[i].c===d)return i;return 0}
  function fresh(c){
    var W=[],n=c.single?1:c.classes.length;for(var o=0;o<n;o++)W.push(zeros());
    return {data:base(c),W:W,so:n-1,sk:0,feed:0,pad:zeros(),steps:0,hist:[]};
  }
  function sum(c){return c.reduce(function(s,v){return s+v},0)}
  function sums(c){return cur.W.map(function(w){var s=0;for(var k=0;k<15;k++)s+=w[k]*c[k];return s})}
  function target(d,o){return cfg.single?(d.c===8?1:0):(d.c===cfg.classes[o]?1:0)}
  function softmax(s){var m=Math.max.apply(null,s),e=s.map(function(v){return Math.exp(v-m)}),t=sum(e);return e.map(function(v){return v/t})}
  function pct(v){return Math.round(v*100)+"%"}
  function winner(s){var b=0;for(var i=1;i<s.length;i++)if(s[i]>s[b])b=i;return b}
  function verdict(c){var s=sums(c);return cfg.single?(s[0]>=0.5?8:1):cfg.classes[winner(s)]}
  function loss(){
    var t=0,n=cur.data.length;
    cur.data.forEach(function(d){var s=sums(d.cells);for(var o=0;o<s.length;o++){var e=s[o]-target(d,o);t+=e*e}});
    return n?t/n:0;
  }
  // 선택한 가중치 t에 대한 이차식 A t^2 + B t + C (other: 다른 노드의 오차 제곱의 합)
  function coef(o,k){
    var n=cur.data.length,A=0,B=0,C=0,other=0;
    cur.data.forEach(function(d){
      var s=sums(d.cells),p=d.cells[k],r=s[o]-cur.W[o][k]*p-target(d,o);
      A+=p*p;B+=2*p*r;C+=r*r;
      for(var j=0;j<s.length;j++)if(j!==o){var e=s[j]-target(d,j);other+=e*e}
    });
    return n?{A:A/n,B:B/n,C:(C+other)/n,other:other}:{A:0,B:0,C:0,other:0};
  }
  function fmt(v,k){var s=v.toFixed(k);if(parseFloat(s)===0)s=(0).toFixed(k);return s.replace("-","−")}
  function trim(v){return String(Math.abs(parseFloat(v.toFixed(3))))}

      '이 칸을 칠한 그림은 칸의 값이 1이라 '+pv0+'에 <span class="m">'+W+'</span>'+jo('이','가')+' 남고, 칠하지 않은 그림은 칸의 값이 0이라 <span class="m">'+W+'</span>'+jo('이','가')+' 사라집니다. '+
      pv0+'은 <span class="m">'+W+pk0+' + (나머지 칸의 가중합)</span>입니다. 나머지 칸의 가중합은 그 그림에서 칠한 다른 칸들의 가중치를 지금 값으로 더한 수입니다. 가중치가 모두 0인 처음에는 이 값이 0이라 식에서 생략하고, 학습이 진행되면 식에 나타납니다.'+
      (cfg.single?' 정답은 숫자 8 그림이면 1, 숫자 1 그림이면 0입니다.':' 정답은 숫자 '+cfg.classes[o]+' 그림이면 1, 아니면 0입니다.');
    var pv=cfg.single?'예측값':'가중합',pk='<i>p</i><sub>'+(k+1)+'</sub>';
    cur.data.forEach(function(d){
      var p=d.cells[k],rest=sums(d.cells)[o]-cur.W[o][k]*p,t0=target(d,o),c=rest-t0,raw,fin,line2;
      var z=Math.abs(rest)<0.005,rs=fmt(rest,2).replace(/^−(.*)$/,'($&)');
      if(p){
        m++;
        var cs=fmt(Math.abs(c),2);
        line2=W+' × 1'+(z?'':' + '+rs);
        raw='('+W+(z?' × 1':' + '+rs)+' − '+t0+')<sup>2</sup>';
        fin=parseFloat(cs)===0?W+'<sup>2</sup>':'('+W+(c<0?' − ':' + ')+(z?trim(c):cs)+')<sup>2</sup>';
      }else{
        line2=W+' × 0'+(z?' = 0':' + '+rs+' = '+fmt(rest,2));
        raw='('+(z?'0':fmt(rest,2))+' − '+t0+')<sup>2</sup>';
        fin=z?trim(c*c):fmt(c*c,3);
      }
      h+='<div class="term '+(p?'has':'none')+'">'+mini(d.cells,k,true)+
        '<div class="st"><span class="lb">① 파란 테두리 칸의 값</span><span class="m">'+pk+' = '+p+'</span> <span>('+(p?'흰색, 칠함':'검은색, 칠하지 않음')+')</span></div>'+
        '<div class="st"><span class="lb">② '+pv+' = <span class="m" style="font-size:12.5px">'+W+pk+'</span>'+(z?'':' + (나머지 칸의 가중합)')+'</span><span class="m">'+line2+'</span>'+(z?'<span class="lb">나머지 칸의 가중합은 0이라 생략</span>':'')+'</div>'+
        '<div class="st"><span class="lb">③ 정답</span><span class="m">'+t0+'</span> <span>(숫자 '+d.c+' 그림)</span></div>'+
        '<div class="st"><span class="lb">④ ('+pv+' − 정답)<sup>2</sup></span><span class="m">'+raw+'</span><div class="formula num">= '+fin+'</div></div>'+
        '<span class="tag">'+(p?'<span class="m">'+W+'</span>에 대한 이차식':'<span class="m">'+W+'</span>'+jo('이','가')+' 없는 상수')+'</span></div>';
    });
    $("terms").innerHTML=h;
    var c2=coef(o,k);
    $("dSum").innerHTML='<i>L</i>('+W+') = <span class="frac"><span>1</span><span>'+n+'</span></span> × '+
      (cfg.single?'(④의 결과 '+n+'개의 합)':'{(④의 결과 '+n+'개의 합) + '+fmt(c2.other,3)+'}')+'<br>= '+polyHtml(c2).replace(/^.*? = /,'');
    $("dWhy").innerHTML=(cfg.single?'':'더한 수 '+fmt(c2.other,3)+'은 다른 출력 노드의 (가중합 − 정답)<sup>2</sup>의 합입니다. <span class="m">'+W+'</span>'+jo('은','는')+' '+nodeName(o)+'에만 연결되므로 이 값은 상수입니다. ')+
      '<span class="m">'+W+'</span>'+jo('이','가')+' 들어 있는 식이 '+m+'개이므로 이차항의 계수는 <span class="m"><span class="frac"><span>'+m+'</span><span>'+n+'</span></span> = '+trim(n?m/n:0)+'</span>입니다.'+
      (m===0?' 이 칸을 칠한 그림이 없어서 손실함수는 상수함수이고, 이 가중치는 학습되지 않습니다.':'')+
      ' 카드의 수는 소수 둘째 자리까지 나타낸 값입니다.';
  }
  function renderSel(){
    var c=coef(cur.so,cur.sk),W=wSym(),v=cur.W[cur.so][cur.sk];
    $("expanded").innerHTML=polyHtml(c);
    $("wLabel").innerHTML='가중치 <span class="m">'+W+'</span>'+jo('을','를')+' 직접 움직이기 ('+(cfg.single?'':nodeName(cur.so)+', ')+cellName(cur.sk)+')';
    $("lblW").innerHTML='<span class="m">'+W+'</span>';
    $("vW").textContent=fmt(v,3);
    $("vD").textContent=fmt(2*c.A*v+c.B,3);
    $("wRange").value=Math.max(WMIN,Math.min(WMAX,v));
    renderDerive();
    drawChart(c);
  }
  function renderStats(){
    $("vL").textContent=fmt(loss(),4);$("vN").textContent=cur.steps;
    $("acc").textContent=cur.data.length+"개 중 "+nOk()+"개";
  }
  function renderTrack(){
    if(!cfg.single)return;
    var z=tpos(0.5);
    var h='<div class="zone1" style="width:'+z+'%"></div><div class="zone8" style="left:'+z+'%"></div>'+
      '<div class="thr" style="left:'+z+'%"><span>기준 0.5</span></div>'+
      '<div class="lane" style="top:22px">정답 1</div><div class="lane" style="top:48px">정답 8</div>';
    cur.data.forEach(function(d){
      var wrong=verdict(d.cells)!==d.c;
      h+='<div class="dot d'+d.c+(wrong?' wrong':'')+'" style="left:'+tpos(sums(d.cells)[0])+'%;top:'+(d.c===8?58:32)+'px"></div>';
    });
    if(sum(cur.pad)>0)h+='<div class="lane" style="top:70px">내 그림</div><div class="dot mine" style="left:'+tpos(sums(cur.pad)[0])+'%;top:80px"></div>';
    $("track").innerHTML=h;
  }
  function renderPad(){
    var btns=$("pad").children,x=sum(cur.pad),s=sums(cur.pad),v=verdict(cur.pad);
    for(var i=0;i<15;i++){btns[i].classList.toggle("on",!!cur.pad[i]);btns[i].setAttribute("aria-pressed",cur.pad[i]?"true":"false")}
    $("myCalc").innerHTML='칠한 '+x+'칸의 가중치의 합 = '+fmt(s[0],3);
    if(!cfg.single){
      var h='<div class="bar" style="color:var(--sub);font-size:12px"><span></span><span>확률</span><span>가중합 → 확률</span></div>',win=winner(s),pr=softmax(s);
      s.forEach(function(val,o){
        h+='<div class="bar'+(x>0&&o===win?' win':'')+'"><span style="color:'+DCOL[cfg.classes[o]]+'">'+nodeName(o)+'</span>'+
          '<div class="tr"><div class="fl" style="left:0;width:'+(pr[o]*100).toFixed(1)+'%;background:'+DCOL[cfg.classes[o]]+'"></div></div><span>'+fmt(val,2)+' → '+pct(pr[o])+'</span></div>';
      });
      $("bars").innerHTML=h;
    }
    $("myVerdict").innerHTML=x===0?'<span class="note">칸을 눌러 숫자를 그려 보세요.</span>':
      '판정 <span class="pill d'+v+'">'+v+'</span>';
  }
  function setup(cv){
    var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
    var g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,r.width,r.height);
    g.font='11px "IBM Plex Sans KR",sans-serif';
    return {g:g,W:r.width,H:r.height};
  }
  function drawChart(c){
    var s=setup($("chart")),g=s.g,W=s.W,H=s.H,ml=36,mr=10,mt=12,mb=24;
    var f=function(t){return c.A*t*t+c.B*t+c.C};
    var ymax=Math.max(f(WMIN),f(WMAX),0.05)*1.08;
    var X=function(t){return ml+(t-WMIN)/(WMAX-WMIN)*(W-ml-mr)},Y=function(v){return mt+(1-v/ymax)*(H-mt-mb)};
    g.fillStyle=css("--sub");g.strokeStyle=css("--line");g.lineWidth=1;g.textAlign="center";
    for(var i=-3;i<=4;i++){var t=i*0.2;g.beginPath();g.moveTo(X(t),mt);g.lineTo(X(t),H-mb);g.stroke();g.fillText(t.toFixed(1).replace("-","−"),X(t),H-mb+14)}
    g.textAlign="right";
    var ys=ymax/4;
    for(var j=0;j<=4;j++){var v=j*ys;g.beginPath();g.moveTo(ml,Y(v));g.lineTo(W-mr,Y(v));g.stroke();g.fillText(v.toFixed(2),ml-5,Y(v)+4)}
    g.strokeStyle=css("--ink");g.lineWidth=2;g.beginPath();
    for(var q=0;q<=140;q++){var tt=WMIN+q/140*(WMAX-WMIN);if(q)g.lineTo(X(tt),Y(f(tt)));else g.moveTo(X(tt),Y(f(tt)))}
    g.stroke();
    var a=cur.W[cur.so][cur.sk];
    if(a>=WMIN&&a<=WMAX){
      var sl=2*c.A*a+c.B,d=0.2;
      g.save();g.beginPath();g.rect(ml,mt,W-ml-mr,H-mt-mb);g.clip();
      g.strokeStyle=css("--accent");g.lineWidth=1.5;g.beginPath();
      g.moveTo(X(a-d),Y(f(a)-sl*d));g.lineTo(X(a+d),Y(f(a)+sl*d));g.stroke();g.restore();
      g.fillStyle=css("--accent");g.beginPath();g.arc(X(a),Y(f(a)),6,0,7);g.fill();
      g.strokeStyle=css("--panel");g.lineWidth=2;g.stroke();
    }else{
      g.fillStyle=css("--bad");g.textAlign="center";g.fillText("현재 가중치가 그래프 범위 밖에 있습니다",(ml+W-mr)/2,mt+24);
    }
  }
  function drawHist(){
    var s=setup($("histc")),g=s.g,W=s.W,H=s.H,ml=36,mr=10,mt=10,mb=20,hs=cur.hist;
    var n=hs.length,ymax=Math.max.apply(null,hs.concat([0.05]))*1.08,xmax=Math.max(10,n-1);
    var X=function(i){return ml+i/xmax*(W-ml-mr)},Y=function(v){return mt+(1-Math.min(v,ymax)/ymax)*(H-mt-mb)};
    g.fillStyle=css("--sub");g.strokeStyle=css("--line");g.lineWidth=1;g.textAlign="right";
    [0,ymax/2,ymax].forEach(function(v){g.beginPath();g.moveTo(ml,Y(v));g.lineTo(W-mr,Y(v));g.stroke();g.fillText(v.toFixed(2),ml-5,Y(v)+4)});
    g.textAlign="left";g.fillText("0",ml,H-mb+14);g.textAlign="right";g.fillText(xmax+"회",W-mr,H-mb+14);
    g.strokeStyle=css("--accent");g.lineWidth=2;g.beginPath();
    hs.forEach(function(v,i){if(i)g.lineTo(X(i),Y(v));else g.moveTo(X(i),Y(v))});
    g.stroke();
    g.fillStyle=css("--accent");g.beginPath();g.arc(X(n-1),Y(hs[n-1]),4,0,7);g.fill();
  }
  function renderAll(){renderSamples();renderMap();renderSel();renderStats();renderTrack();renderPad();drawHist()}
  function say(id,t,warn){var m=$(id);m.innerHTML=t;m.className="msg num"+(warn?" warn":"")}
  function stopAuto(){if(timer){clearInterval(timer);timer=null;$("auto").textContent="자동 실행"}}
  function record(){cur.hist.push(loss());if(cur.hist.length>400)cur.hist.shift()}
  function newHist(){cur.hist=[];record()}
  function stepAll(){
    var eta=parseFloat($("eta").value),n=cur.data.length,before=loss(),G=cur.W.map(zeros);
    cur.data.forEach(function(d){var s=sums(d.cells);for(var o=0;o<s.length;o++){var e=s[o]-target(d,o);for(var k=0;k<15;k++)G[o][k]+=2*d.cells[k]*e/n}});
    for(var o=0;o<cur.W.length;o++)for(var k=0;k<15;k++)cur.W[o][k]-=eta*G[o][k];
    cur.steps++;record();
    var now=loss();
    if(now>1000){stopAuto();say("msg","손실함수의 값이 계속 커집니다. 학습률이 너무 큽니다.",true)}
    else if(now>before+1e-12)say("msg","손실함수의 값이 "+fmt(before,4)+"에서 "+fmt(now,4)+"로 커졌습니다.",true);
    else say("msg","가중치 "+(15*cur.W.length)+"개를 각각 접선의 기울기 반대쪽으로 옮겼습니다. 손실함수의 값 "+fmt(before,4)+" → "+fmt(now,4));
    renderAll();
  }
  function stepOne(){
    var eta=parseFloat($("eta").value),c=coef(cur.so,cur.sk),v=cur.W[cur.so][cur.sk],d=2*c.A*v+c.B,nw=v-eta*d,W=wSym();
    say("msg2",'<span class="m">'+W+' − <i>η</i><i>L</i>′('+W+') = '+fmt(v,3)+' − '+eta+' × ('+fmt(d,3)+') = '+fmt(nw,3)+'</span>');
    cur.W[cur.so][cur.sk]=nw;cur.steps++;record();renderAll();
  }
  function resetW(){
    stopAuto();cur.W=cur.W.map(zeros);cur.steps=0;newHist();
    say("msg",cfg.single?"가중치가 모두 0이라 모든 그림을 1로 판정합니다. 한 번 이동을 눌러 보세요.":"가중치가 모두 0이라 가중합이 모두 같고, 모든 그림을 1로 판정합니다. 한 번 이동을 눌러 보세요.");
    say("msg2","");renderAll();
  }
  function show(i,keepHash){
    stopAuto();ci=i;cfg=CH[i];
    if(!S[i]){S[i]=fresh(cfg);cur=S[i];cur.feed=firstOf(8);newHist();}
    cur=S[i];
    renderText();
    say("msg",cur.steps?"":"가중치가 모두 0입니다. 한 번 이동을 눌러 보세요.");say("msg2","");
    renderAll();
    if(!keepHash){try{location.hash="chapter-"+(i+1)}catch(e){}}
  }
  function fromHash(){var m=/^#chapter-([123])$/.exec(location.hash||"");return m?+m[1]-1:0}
  function selectW(o,k){cur.so=o;cur.sk=k;say("msg2","");renderSamples();renderMap();renderSel()}

  var padEl=$("pad"),i,b;
  for(i=0;i<15;i++){
    b=document.createElement("button");b.type="button";b.className="cellbtn";b.dataset.i=i;
    b.setAttribute("aria-label",cellName(i));padEl.appendChild(b);
  }
  var ax="";[0,0.5,1].forEach(function(v){ax+='<span style="left:'+tpos(v)+'%">'+v+'</span>'});$("axis2").innerHTML=ax;
  document.querySelector(".tabs").addEventListener("click",function(e){var t=e.target.closest(".tab");if(t)show(+t.dataset.ch)});
  window.addEventListener("hashchange",function(){var n=fromHash();if(n!==ci)show(n,true)});
  $("maps").addEventListener("click",function(e){var t=e.target.closest(".wcell");if(t)selectW(+t.dataset.o,+t.dataset.k)});
  $("net").addEventListener("click",function(e){
    var t=e.target.closest("[data-k]");if(t){selectW(cur.so,+t.getAttribute("data-k"));return}
    t=e.target.closest("[data-o]");if(t)selectW(+t.getAttribute("data-o"),cur.sk);
  });
  padEl.addEventListener("click",function(e){var t=e.target.closest(".cellbtn");if(!t)return;cur.pad[+t.dataset.i]^=1;cur.feed="pad";renderSamples();renderPad();renderTrack();renderNet()});
  $("addBtns").addEventListener("click",function(e){
    var t=e.target.closest("button");if(!t)return;
    if(t.id==="clearPad"){cur.pad=zeros();renderPad();renderTrack();renderNet();return}
    if(sum(cur.pad)===0)return;
    stopAuto();cur.data.push({cells:cur.pad.slice(),c:+t.dataset.add,base:false});cur.pad=zeros();cur.feed=cur.data.length-1;newHist();renderAll();
  });
  $("samples").addEventListener("click",function(e){
    var t=e.target.closest("[data-del]");
    if(!t){var c=e.target.closest("[data-feed]");if(c){cur.feed=+c.dataset.feed;renderSamples();renderNet()}return}
    stopAuto();cur.data.splice(+t.dataset.del,1);cur.feed=0;newHist();renderAll();
  });
  $("resetData").addEventListener("click",function(){stopAuto();cur.data=base(cfg);cur.feed=firstOf(8);newHist();renderAll()});
  $("stepAll").addEventListener("click",function(){stopAuto();stepAll()});
  $("stepOne").addEventListener("click",function(){stopAuto();stepOne()});
  $("auto").addEventListener("click",function(){
    if(timer){stopAuto();return}
    $("auto").textContent="멈춤";var left=200;
    timer=setInterval(function(){if(left--<=0){stopAuto();return}stepAll()},150);
  });
  $("resetW").addEventListener("click",resetW);
  $("wRange").addEventListener("input",function(){
    stopAuto();cur.W[cur.so][cur.sk]=parseFloat(this.value);cur.hist[cur.hist.length-1]=loss();
    renderSamples();renderMap();renderStats();renderTrack();renderPad();drawHist();
    var c=coef(cur.so,cur.sk),v=cur.W[cur.so][cur.sk];$("vW").textContent=fmt(v,3);$("vD").textContent=fmt(2*c.A*v+c.B,3);drawChart(c);
  });
  function redraw(){drawChart(coef(cur.so,cur.sk));drawHist()}
  window.addEventListener("resize",redraw);
  try{
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",redraw);
    new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
  }catch(e){}
  show(fromHash(),true);
})();
</script>
</body>
</html>
