<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단어별 가중치로 문장 분류하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* 배치: 한 줄 세로 흐름(데이터 → 손실함수 → 분류 결과 → 직접 그리기), 넓은 화면에서는 2단 */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#18212f; --sub:#5b6676; --line:#d5dbe4;
  --accent:#2b4acb; --one:#0f8a8a; --seven:#8a4fd3; --eight:#d9730d; --bad:#d0342c; --cell:#e6eaf0;
  --pix-on:#ffffff; --pix-off:#0e1116; --pix-grid:#444c5c; --pix-hl:#4f86ff;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-math:"STIX Two Text","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151c; --panel:#1a202a; --ink:#e8ecf2; --sub:#9aa5b5; --line:#313a48;
    --accent:#8ea4ff; --one:#3cc4c4; --seven:#c0a2ff; --eight:#f2a04a; --bad:#ff7b72; --cell:#283140;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151c; --panel:#1a202a; --ink:#e8ecf2; --sub:#9aa5b5; --line:#313a48;
  --accent:#8ea4ff; --one:#3cc4c4; --seven:#c0a2ff; --eight:#f2a04a; --bad:#ff7b72; --cell:#283140;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:14px}
header h1{font-size:22px;line-height:1.3;margin:0 0 10px;text-wrap:balance}
header .chapters{margin-bottom:10px}
.chapters{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chapters a{display:flex;flex-direction:column;align-items:center;padding:6px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--sub);text-decoration:none;font-weight:600;font-size:13.5px;line-height:1.25;text-align:center}
.chapters a small{font-size:11px;font-weight:500;opacity:.8}
.chapters a.cur{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chapters a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:860px){
  .chapters a{flex-direction:row;justify-content:center;gap:8px;padding:9px}
  .chapters a small{font-size:13px}
}
header p{margin:0;color:var(--sub);max-width:62ch}
.cols{display:grid;gap:14px}
@media (min-width:820px){.cols{grid-template-columns:1fr 1fr;align-items:start}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0}
h2{font-size:16px;margin:0;display:flex;gap:8px;align-items:baseline}
h2 .n{font-family:var(--font-math);color:var(--accent);font-weight:600}
.note{color:var(--sub);font-size:13.5px;margin:0}
.m{font-family:var(--font-math);font-size:1.08em;white-space:nowrap}
.m i{font-style:italic}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;font-size:.92em}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
.formula{font-family:var(--font-math);font-size:17px;overflow-x:auto;padding:4px 0;white-space:nowrap}
.formula i{font-style:italic}
.num{font-variant-numeric:tabular-nums}

/* 학습 자료 */
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.s{border:1px solid var(--line);border-radius:8px;padding:6px 4px;display:grid;justify-items:center;gap:3px;font-size:12px;position:relative}
.s.d1{border-top:3px solid var(--one)} .s.d7{border-top:3px solid var(--seven)} .s.d8{border-top:3px solid var(--eight)}
.s.wrong{outline:2px solid var(--bad);outline-offset:1px}
.mini{display:grid;grid-template-columns:repeat(3,9px);gap:1px;background:var(--pix-grid);padding:1px;border-radius:2px}
.mini b{width:9px;height:9px;background:var(--pix-off)}
.mini b.on{background:var(--pix-on)}
.s .m{font-size:13px}
.s button{position:absolute;top:1px;right:2px;border:0;background:none;color:var(--sub);font-size:14px;line-height:1;padding:2px 4px;cursor:pointer}

/* 조작부 */
canvas{width:100%;height:230px;display:block;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.b{font:inherit;font-weight:600;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.b.p{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button.b:focus-visible,input:focus-visible,select:focus-visible,.cellbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:inherit;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.stat span{display:block;font-size:12px;color:var(--sub)}
.stat strong{font-size:15px}
.msg{font-size:13.5px;min-height:1.6em;margin:0}
.msg.warn{color:var(--bad);font-weight:600}

/* 분류 결과 수직선 */
.track{position:relative;height:92px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.zone8{position:absolute;top:0;bottom:0;right:0;background:color-mix(in srgb,var(--eight) 10%,transparent)}
.zone1{position:absolute;top:0;bottom:0;left:0;background:color-mix(in srgb,var(--one) 10%,transparent)}
.thr{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ink)}
.thr span{position:absolute;top:2px;left:4px;font-size:11px;white-space:nowrap}
.lane{position:absolute;left:0;font-size:11px;color:var(--sub);padding-left:4px}
.dot{position:absolute;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--panel)}
.dot.d1{background:var(--one)} .dot.d8{background:var(--eight)}
.dot.wrong{box-shadow:0 0 0 2px var(--bad)}
.dot.mine{background:var(--ink);border-radius:3px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;color:var(--panel)}
.pill.d1{background:var(--one)} .pill.d7{background:var(--seven)} .pill.d8{background:var(--eight)}

/* 직접 그리기 */
.draw{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,48px);gap:3px;touch-action:none;background:var(--pix-grid);padding:3px;border-radius:8px}
.cellbtn{width:48px;height:48px;border:0;border-radius:4px;background:var(--pix-off);cursor:pointer;padding:0}
.cellbtn.on{background:var(--pix-on)}
.out{display:grid;gap:6px;min-width:150px;flex:1}
@media (prefers-reduced-motion:no-preference){.dot{transition:left .25s}}

/* 가중치 지도 */
.wwrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.wmap{display:grid;grid-template-columns:repeat(3,56px);gap:4px}
.wcell{width:56px;height:46px;border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:0;font:inherit;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.wcell.sel{outline:3px solid var(--accent);outline-offset:1px}
.wcell:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:10px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;font-style:normal}
.side{flex:1;min-width:200px;display:grid;gap:8px}
canvas.small{height:120px}
.mini b{position:relative}
.mini b.hl{outline:2px solid var(--pix-hl);z-index:1}
.mini b.hl.on{background:#b9cdff}
.mini.big{grid-template-columns:repeat(3,13px)}
.mini.big b{width:13px;height:13px}
h3{font-size:14.5px;margin:6px 0 0}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:8px}
.term{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:4px;justify-items:start;font-size:12.5px}
.term.has{border-left-color:var(--accent)}
.term.none{color:var(--sub)}
.term .formula{font-size:16px;padding:0;color:var(--ink)}
.term.has .formula{color:var(--accent);font-weight:600}
.tag{font-size:11.5px;font-weight:600}
.st{display:block;line-height:1.45}
.st .lb{display:block;font-size:11px;color:var(--sub)}
.st .m{font-size:14.5px;white-space:normal}
#dSum{white-space:normal;line-height:1.9}
#myCalc{white-space:normal;font-size:15px}
.term.none .formula{color:var(--sub)}
.s{cursor:pointer}
.s.fed{background:color-mix(in srgb,var(--accent) 12%,var(--panel));box-shadow:0 0 0 2px var(--accent)}
.netwrap{display:flex;justify-content:center}
#net{width:100%;max-width:400px;height:auto;display:block}
#net text{font-family:var(--font-body);font-size:10.5px;fill:var(--ink);font-variant-numeric:tabular-nums}
#net .sub{fill:var(--sub)}
#net .wl{paint-order:stroke;stroke:var(--panel);stroke-width:3px}
#net .big{font-size:15px;font-weight:700}
#net g[data-k]{cursor:pointer}
.fedinfo{display:flex;gap:10px;align-items:center;font-size:13.5px}
.maps{display:flex;gap:8px;flex-wrap:wrap}
.maps .mt{font-size:12px;font-weight:600;margin-bottom:3px;white-space:nowrap}
.maps.o3 .mt{font-size:10.5px}
.maps.o2 .wmap{grid-template-columns:repeat(3,46px)} .maps.o2 .wcell{width:46px;height:40px;font-size:12px}
.maps.o3 .wmap{grid-template-columns:repeat(3,31px);gap:3px} .maps.o3 .wcell{width:31px;height:30px;font-size:9.5px;border-radius:4px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:76px 1fr 92px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:14px;border-radius:7px;background:var(--cell);position:relative;overflow:hidden}
.bar .fl{position:absolute;top:0;bottom:0;border-radius:7px}
.bar.win{font-weight:700}
.fold{border:1px solid var(--line);border-radius:8px}
.fold{border-color:#2b4acb}
.fold summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:15px;color:#ffffff;background:#2b4acb;border-radius:7px}
.fold[open] summary{border-radius:7px 7px 0 0;margin-bottom:12px}
.fold summary .m{color:#ffffff}
.fold summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foldin{display:grid;gap:10px;padding:0 12px 12px;min-width:0}
[hidden]{display:none !important}
.axis2{position:relative;height:16px;font-size:11px;color:var(--sub)}
.axis2 span{position:absolute;transform:translateX(-50%)}

.animbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#animStep{font-size:12.5px;color:var(--sub);margin-left:4px}
.strip{display:flex;flex-wrap:wrap;gap:5px}
.strip span{padding:2px;border-radius:5px;border:2px solid transparent;opacity:.3;transition:opacity .3s}
.strip span.done{opacity:1}
.strip span.cur{opacity:1;border-color:var(--accent)}
.stagewrap{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);align-items:start}

.stagehead{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px}
.term.stage{max-width:300px}
.term .st.off,.term .tag.off{visibility:hidden}
.accum{display:grid;gap:8px;align-content:start;min-width:0}
#accText{white-space:normal;line-height:1.9;font-size:15px}
#accText .acclb{display:block;font-family:var(--font-body);font-size:12px;color:var(--sub);line-height:1.5;margin:2px 0}
.newterm{color:var(--accent);font-weight:700}
#accText .tm{white-space:nowrap}
@keyframes stIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.pop,.newterm{animation:stIn .5s ease}
.term.enter{animation:cardIn .4s ease}
@media (prefers-reduced-motion:reduce){.pop,.newterm,.term.enter{animation:none}}

.calcbox{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.cgrid{display:grid;grid-template-columns:repeat(3,52px);gap:3px;background:var(--pix-grid);padding:3px;border-radius:8px;flex:0 0 auto}
.cc{height:46px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;line-height:1.15;font-variant-numeric:tabular-nums;font-family:var(--font-math)}
.cc.on{background:var(--pix-on);color:#0e1116}
.cc.off{background:var(--pix-off);color:#c7ccd6}
.cc small{font-size:9.5px;opacity:.75}
.cc.off.proc span{opacity:.55}
.cc.on.proc{background:#fff1dc}
.cc.csel{outline:3px solid var(--pix-hl);outline-offset:-3px}
.cc.ccur{box-shadow:0 0 0 3px #f2a04a;position:relative;z-index:1}
.clines{display:grid;gap:9px;flex:1 1 200px;min-width:0}
.cl{font-size:13.5px;line-height:1.6}
.cl .lb{display:block;font-size:11.5px;color:var(--sub);font-family:var(--font-body)}
.cl .m{white-space:normal;font-size:15px}
.cnow{color:var(--eight);font-weight:600}
.spd{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:4px}
.cfin{color:var(--accent)}
/* ===== 감성 분류 전용 ===== */
:root{--pos:#1f8a4c;--neg:#c4452c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pos:#4cc283;--neg:#ff8a70}}
:root[data-theme="dark"]{--pos:#4cc283;--neg:#ff8a70}
.sents{display:grid;gap:6px}
.sent{display:grid;grid-template-columns:22px 1fr;gap:1px 8px;align-items:start;padding:7px 26px 7px 10px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;cursor:pointer;position:relative;background:var(--panel)}
.sent.cs.c0{border-left-color:var(--pos)}
.sent.cs.c1{border-left-color:var(--neg)}
.sent.cm.c0{border-left-color:var(--one)}
.sent.cm.c1{border-left-color:var(--seven)}
.sent.cm.c2{border-left-color:var(--eight)}
.sent.wrong{outline:2px solid var(--bad);outline-offset:1px}
.sent.fed{box-shadow:0 0 0 2px var(--accent)}
.sno{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;grid-row:1/3;padding-top:2px}
.stx{font-size:14px;line-height:1.55}
.sres{font-size:11.5px;color:var(--sub)}
.sent button{position:absolute;top:2px;right:4px;border:0;background:none;color:var(--sub);font-size:15px;cursor:pointer;padding:2px 4px}
mark.kw{background:color-mix(in srgb,var(--eight) 24%,transparent);color:inherit;border-radius:3px;padding:0 1px;font-weight:600}
mark.kw.hl{background:var(--accent);color:var(--panel)}
.fedinfo{flex-direction:column;align-items:flex-start;gap:2px}
.ftx{font-size:14.5px;line-height:1.7}
.ftx.big{font-size:16px;margin-bottom:6px}
.wlist{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wbtn{display:grid;grid-template-columns:auto 1fr;column-gap:6px;align-items:baseline;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--ink);font:inherit;text-align:left}
.wbtn .wk{font-family:var(--font-math);font-size:13px;color:var(--sub)}
.wbtn .ww{font-weight:700;font-size:14px}
.wbtn .wv{grid-column:1/3;font-size:13px}
.wbtn.sel{outline:3px solid var(--accent);outline-offset:1px}
.wbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mytext{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.mytext:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.b.ex{font-size:12.5px;padding:5px 9px;font-weight:500}
.mine{display:grid;gap:8px}
.pill.pp{background:var(--pos)}
.pill.pn{background:var(--neg)}
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(68px,1fr));gap:4px;flex:0 0 auto;width:min(100%,260px)}
.wc{border:1px solid var(--line);border-radius:6px;padding:4px 5px;display:flex;flex-direction:column;align-items:center;font-size:13px;line-height:1.3;font-variant-numeric:tabular-nums}
.wc small{font-family:var(--font-body);font-size:12px;font-weight:700}
.wc span{font-family:var(--font-math)}
.wc.on{background:color-mix(in srgb,var(--eight) 20%,var(--panel))}
.wc.off{color:var(--sub);background:var(--cell)}
.wc.off.proc{opacity:.55}
.wc.on.proc{background:color-mix(in srgb,var(--eight) 38%,var(--panel))}
.wc.csel{outline:3px solid var(--accent);outline-offset:-2px}
.wc.ccur{box-shadow:0 0 0 3px var(--eight)}
.strip span{min-width:28px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;padding:2px 4px;border:2px solid var(--line)}
.strip span.has{font-weight:700;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.ttx{font-size:13px;line-height:1.5;margin-bottom:2px}
@media (prefers-reduced-motion:reduce){.wc.pop{animation:none}}
header .chapters{grid-template-columns:repeat(2,1fr)}
.wtwrap{overflow-x:auto}
.wtable{border-collapse:separate;border-spacing:4px;font-size:13px;width:100%;max-width:420px}
.wtable th{font-weight:700;text-align:left;white-space:nowrap;padding:0 4px}
.wtable thead th{text-align:center;font-size:12.5px}
.wcell2{width:100%;min-width:62px;font:inherit;font-variant-numeric:tabular-nums;padding:6px 4px;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--ink)}
.wcell2.sel{outline:3px solid var(--accent);outline-offset:1px}
.wcell2:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mdet summary{cursor:pointer;font-size:13px;color:var(--sub)}
.mdet .formula{font-size:14.5px;white-space:normal}
</style>
</head>
<body>
<main>
<header>
  <h1>단어별 가중치로 문장 분류하기</h1>
  <nav class="chapters" aria-label="챕터">
    <a href="#ch1" data-ch="0">1장<small>감성 분석 · 출력 노드 1개</small></a>
    <a href="#ch2" data-ch="1">2장<small>주제 분류 · 출력 노드 3개</small></a>
  </nav>
  <p id="intro"></p>
</header>

<div class="cols">
<section aria-labelledby="h1">
  <h2 id="h1"><span class="n">1</span>학습 자료</h2>
  <p class="note" id="note1"></p>
  <div class="sents" id="sents"></div>
  <div class="row"><button class="b" id="resetData" type="button">처음 자료로 되돌리기</button></div>
</section>

<section aria-labelledby="hn">
  <h2 id="hn"><span class="n">2</span>인공신경망으로 나타내기</h2>
  <p class="note" id="note2"></p>
  <div class="fedinfo" id="fedinfo"></div>
  <div class="netwrap"><svg id="net" viewBox="0 0 346 400" role="img" aria-label="단어 입력 노드와 출력 노드로 이루어진 인공신경망"></svg></div>
  <div class="legend"><span><i style="background:var(--pos)"></i>양수 가중치</span><span><i style="background:var(--neg)"></i>음수 가중치</span><span><i style="background:var(--accent)"></i>선택한 가중치</span><span>선이 굵을수록 절댓값이 큽니다</span></div>
  <p class="note" id="note2b"></p>
</section>
</div>

<div class="cols">
<section aria-labelledby="h3">
  <h2 id="h3"><span class="n">3</span>단어별 가중치와 가중치 하나의 손실함수</h2>
  <p class="note" id="note3"></p>
  <div id="wbox"></div>
  <div class="formula num" id="expanded"></div>

  function pct(v){return Math.round(v*100)+"%"}
  function loss(){var t=0,n=cur.data.length;cur.data.forEach(function(d){var s=sums(d.p);for(var o=0;o<s.length;o++){var e=s[o]-target(d,o);t+=e*e}});return n?t/n:0}
  function coef(o,k){
    var n=cur.data.length,A=0,B=0,C=0,other=0;
    cur.data.forEach(function(d){var s=sums(d.p),p=d.p[k],r=s[o]-cur.W[o][k]*p-target(d,o);A+=p*p;B+=2*p*r;C+=r*r;
      for(var j=0;j<s.length;j++)if(j!==o){var e=s[j]-target(d,j);other+=e*e}});
    return n?{A:A/n,B:B/n,C:(C+other)/n,other:other}:{A:0,B:0,C:0,other:0};

    });

  // ② 신경망
  function edgeSet(o,ix,ox,oy,p,ys,full){

      if(!full){h+='<line x1="'+ix+'" y1="'+y+'" x2="'+ox+'" y2="'+oy+'" style="stroke:var(--line);stroke-width:0.7"/>';continue}
      var col=isSel?'var(--accent)':(v>=0?'var(--pos)':'var(--neg)');
      var sw=Math.max(0.8,Math.min(7,Math.abs(v)*5))+(isSel?1.5:0);
      var lx=ix+0.4*(ox-ix),ly=y+0.4*(oy-y);

  function drawChart(c){
    var s=setup($("chart")),g=s.g,W=s.W,H=s.H,ml=36,mr=10,mt=12,mb=24;
    var f=function(t){return c.A*t*t+c.B*t+c.C};
    var ymax=Math.max(f(WMIN),f(WMAX),0.05)*1.08;
    var X=function(t){return ml+(t-WMIN)/(WMAX-WMIN)*(W-ml-mr)},Y=function(v){return mt+(1-v/ymax)*(H-mt-mb)};
    g.fillStyle=css("--sub");g.strokeStyle=css("--line");g.lineWidth=1;g.textAlign="center";
    xTicks(g,X,H,mb,mt);
    g.textAlign="right";
    for(var j=0;j<=4;j++){var v=j*ymax/4;g.beginPath();g.moveTo(ml,Y(v));g.lineTo(W-mr,Y(v));g.stroke();g.fillText(v.toFixed(2),ml-5,Y(v)+4)}
    g.strokeStyle=css("--ink");g.lineWidth=2;g.beginPath();
    for(var q=0;q<=140;q++){var tt=WMIN+q/140*(WMAX-WMIN);if(q)g.lineTo(X(tt),Y(f(tt)));else g.moveTo(X(tt),Y(f(tt)))}
    g.stroke();
    var a=cur.W[cur.so][cur.sk];
    if(a>=WMIN&&a<=WMAX){
      var sl=2*c.A*a+c.B,d=0.35;
      g.save();g.beginPath();g.rect(ml,mt,W-ml-mr,H-mt-mb);g.clip();
      g.strokeStyle=css("--accent");g.lineWidth=1.5;g.beginPath();
      g.moveTo(X(a-d),Y(f(a)-sl*d));g.lineTo(X(a+d),Y(f(a)+sl*d));g.stroke();g.restore();
      g.fillStyle=css("--accent");g.beginPath();g.arc(X(a),Y(f(a)),6,0,7);g.fill();
      g.strokeStyle=css("--panel");g.lineWidth=2;g.stroke();
    }else{g.fillStyle=css("--bad");g.textAlign="center";g.fillText("현재 가중치가 그래프 범위 밖에 있습니다",(ml+W-mr)/2,mt+24)}
  }

  // ===== 식이 만들어지는 과정 애니메이션 =====
  function foldOpen(){var f=document.querySelector(".fold");return !!(f&&f.open)}
  function termVal(t,x){return t.p?(x+t.c)*(x+t.c):t.c*t.c}
  function accSum(cnt,x){var s=0;for(var i=0;i<cnt;i++)s+=termVal(DC[i],x);return s}
  function animStop(){if(ANIM.t){clearTimeout(ANIM.t);ANIM.t=null}ANIM.playing=false}
  function present(i){var r=[];DC[i].pv.forEach(function(v,j){if(v)r.push(j)});return r}
  // 단계: 0 단어의 값, 1 없는 단어 처리, 2..m+1 있는 단어 하나씩, m+2 가중합, m+3 정답, m+4 (가중합 − 정답)²
  function lastSub(i){return present(i).length+4}
  function stepDelay(i,sub){
    var pr=present(i),m=pr.length,t;
    if(sub<=1)t=1600;else if(sub<=m+1)t=(pr[sub-2]===cur.sk?1700:1100);else if(sub===m+2)t=1600;else if(sub===m+3)t=1300;else t=2300;
    return t*SPEED;
  }
  function stageHtml(i,sub,live){
    var d=DC[i],k=cur.sk,o=cur.so,w=cur.W[o],Ws=wSym(),pr=present(i),m=pr.length;
    var doneW=Math.max(0,Math.min(m,sub-1)),curW=(sub>=2&&sub<=m+1)?pr[sub-2]:-1;
    var res=d.p?(d.z?Ws:Ws+' + '+d.rs):(d.z?'0':fmt(d.rest,2));
    var g='<div class="wgrid">';
    for(var j=0;j<N;j++){
      var p=d.pv[j],qi=pr.indexOf(j),proc=p?(qi>=0&&qi<doneW):sub>=1;
      var cls='wc '+(p?'on':'off')+(j===k?' csel':'')+(j===curW?' ccur':'')+(proc?' proc':'')+(live&&(j===curW||(sub===1&&!p))?' pop':'');
      var txt=proc?(p?(j===k?Ws:fmt(w[j],2)):'0'):String(p);
      g+='<div class="'+cls+'"><small>'+VOC[j]+'</small><span>'+(proc?'':pSym(j)+' = ')+txt+'</span></div>';
    }
    g+='</div>';
    var L=[];
    L.push('<div class="cl'+(live&&sub===0?' pop':'')+'"><span class="lb">① 단어의 값</span>'+cfg.noun+'에 있는 단어는 1, 없는 단어는 0입니다.</div>');
    if(sub>=1)L.push('<div class="cl'+(live&&sub===1?' pop':'')+'"><span class="lb">② '+(cfg.single?'':nodeName(o)+'의 ')+'가중합 구하기: 단어의 값 × 가중치</span>없는 단어는 값이 0이라 가중치를 곱해도 0입니다. 있는 단어만 하나씩 곱합니다.</div>');
    if(curW>=0){
      var wk=curW===k?Ws:wS(o,curW),pv=curW===k?Ws:fmt(w[curW],2),pvp=curW===k?Ws:(w[curW]<-0.005?'('+pv+')':pv);
      L.push('<div class="cl cnow'+(live?' pop':'')+'">"'+VOC[curW]+'": <span class="m">'+pSym(curW)+' × '+wk+' = 1 × '+pvp+' = '+pv+'</span>'+(curW===k?'<span class="lb">고른 가중치는 문자로 남겨 둡니다.</span>':'')+'</div>');
    }
    if(sub>=2){
      var terms=[];for(var q=0;q<doneW;q++){var j2=pr[q],tv=j2===k?Ws:fmt(w[j2],2),neg=j2!==k&&w[j2]<-0.005;terms.push(q===0?tv:(neg?' − '+tv.replace('−',''):' + '+tv))}
      L.push('<div class="cl'+(live&&sub===m+2?' pop':'')+'"><span class="lb">가중합 = 있는 단어의 (단어의 값 × 가중치)를 모두 더한 값</span><span class="m">'+terms.join('')+(sub>=m+2?' = <b>'+res+'</b>':'')+'</span></div>');
    }
    if(sub>=m+3)L.push('<div class="cl'+(live&&sub===m+3?' pop':'')+'"><span class="lb">③ 정답</span><span class="m">'+tlab(d.t0,d.cls).replace(/ \(/,'</span> (')+'</div>');
    if(sub>=m+4)L.push('<div class="cl'+(live&&sub===m+4?' pop':'')+'"><span class="lb">④ (가중합 − 정답)<sup>2</sup></span><span class="m">('+res+' − '+d.ts+')<sup>2</sup> = </span><b class="m cfin">'+d.fin+'</b></div>');
    return '<div class="stagehead">'+(i+1)+'번째 '+cfg.noun+' / '+DC.length+'개</div><div class="ftx big">'+mark(d.text,k)+'</div><div class="calcbox">'+g+'<div class="clines">'+L.join('')+'</div></div>';
  }
  function renderAnim(){
    var n=DC.length;if(!n)return;
    var A=ANIM;if(A.k>n-1){A.k=n-1;A.sub=0}
    var done=A.done;
    $("terms").style.display=done?"":"none";$("dSum").style.display=done?"":"none";$("dWhy").style.display=done?"":"none";
    $("animStage").style.display=done?"none":"";
    var cnt=done?n:A.k+(A.sub>=lastSub(A.k)?1:0);
    var s="";
    for(var i=0;i<n;i++){var cl=(i<cnt?"done":"")+(!done&&i===A.k?" cur":"")+(DC[i].p?" has":"");s+='<span class="'+cl+'">'+(i+1)+'</span>'}
    $("animStrip").innerHTML=s;
    if(!done)$("animStage").innerHTML=stageHtml(A.k,A.sub,A.playing);
    var t;
    if(cnt===0)t=cfg.noun+'마다 (가중합 − 정답)<sup>2</sup>을 구해 하나씩 더합니다.';
    else{
      var parts=[];for(var q=0;q<cnt;q++)parts.push('<span class="tm'+(q===cnt-1&&!done&&A.playing?' newterm':'')+'">'+DC[q].fin+'</span>');
      t='<span class="acclb">지금까지 더한 값 ('+cnt+'개 / '+n+'개)</span>'+parts.join(' + ');
      if(cnt===n)t+='<span class="acclb">'+n+'개를 모두 더한 뒤 '+n+([0,3,6].indexOf(n%10)>=0?'으로':'로')+' 나누면'+(cfg.single?'':' (다른 노드의 값도 더해서)')+' ③의 손실함수가 됩니다.</span>';
    }
    $("accText").innerHTML=t;
    $("animStep").textContent=done?"모두 계산했습니다":(A.k+1)+"번째 "+cfg.noun+" 계산 중";
    $("animPlay").textContent=A.playing?"일시 정지":(done?"처음부터 다시 보기":(A.k===0&&A.sub===0?"차례로 보기":"이어서 보기"));
    ACC_CNT=cnt;drawAcc();
  }
  function drawAcc(){
    var cv=$("accChart");if(!cv||!foldOpen())return;
    var s=setup(cv),g=s.g,W=s.W,H=s.H,ml=36,mr=10,mt=12,mb=22,n=DC.length,cnt=ACC_CNT;
    if(!W||!H)return;
    var ymax=1;for(var q=0;q<=60;q++){var tw=WMIN+q/60*(WMAX-WMIN);ymax=Math.max(ymax,accSum(n,tw))}ymax*=1.08;
    var X=function(t){return ml+(t-WMIN)/(WMAX-WMIN)*(W-ml-mr)},Y=function(v){return mt+(1-v/ymax)*(H-mt-mb)};
    g.fillStyle=css("--sub");g.strokeStyle=css("--line");g.lineWidth=1;g.textAlign="center";
    xTicks(g,X,H,mb,mt);
    g.textAlign="right";for(var jj=0;jj<=3;jj++){var v=jj*ymax/3;g.beginPath();g.moveTo(ml,Y(v));g.lineTo(W-mr,Y(v));g.stroke();g.fillText(v.toFixed(1),ml-5,Y(v)+4)}
    var line=function(c,col,wd,dash){g.save();g.beginPath();g.rect(ml,mt,W-ml-mr,H-mt-mb);g.clip();g.strokeStyle=col;g.lineWidth=wd;g.setLineDash(dash||[]);g.beginPath();
      for(var q=0;q<=120;q++){var tt=WMIN+q/120*(WMAX-WMIN),yy=Y(accSum(c,tt));if(q)g.lineTo(X(tt),yy);else g.moveTo(X(tt),yy)}g.stroke();g.restore()};
    if(cnt>1)line(cnt-1,css("--sub"),1.5,[4,4]);
    if(cnt>0)line(cnt,css("--accent"),2.5);
    g.textAlign="left";g.fillStyle=css("--sub");g.fillText("지금까지 더한 값의 그래프",ml+6,mt+12);
  }
  function animTick(){
    var A=ANIM,n=DC.length;if(!A.playing)return;
    if(A.sub<lastSub(A.k)){A.sub++;renderAnim();A.t=setTimeout(animTick,stepDelay(A.k,A.sub))}
    else if(A.k<n-1){A.k++;A.sub=0;renderAnim();A.t=setTimeout(animTick,stepDelay(A.k,0))}
    else{A.done=true;A.playing=false;A.t=null;renderAnim()}
  }
  function startAnim(){
    animStop();ANIM.k=0;ANIM.sub=0;ANIM.done=false;
    if(RM){ANIM.done=true;renderAnim();return}
    ANIM.playing=true;renderAnim();ANIM.t=setTimeout(animTick,stepDelay(0,0));
  }

  function renderAll(){renderSents();renderWbox();renderSel();renderStats();renderMine();drawHist()}
  function say(id,t,warn){var m=$(id);m.innerHTML=t;m.className="msg num"+(warn?" warn":"")}
  function stopAuto(){if(timer){clearInterval(timer);timer=null;$("auto").textContent="자동 실행"}}
  function record(){cur.hist.push(loss());if(cur.hist.length>400)cur.hist.shift()}
  function newHist(){cur.hist=[];record()}
  function stepAll(){
    var eta=parseFloat($("eta").value),n=cur.data.length,before=loss(),G=cur.W.map(function(){return zeros()});
    cur.data.forEach(function(d){var s=sums(d.p);for(var o=0;o<s.length;o++){var e=s[o]-target(d,o);for(var k=0;k<N;k++)G[o][k]+=2*d.p[k]*e/n}});
    for(var o=0;o<cur.W.length;o++)for(var k=0;k<N;k++)cur.W[o][k]-=eta*G[o][k];
    cur.steps++;record();
    var now=loss();
    if(now>1000){stopAuto();say("msg","손실함수의 값이 계속 커집니다. 학습률이 너무 큽니다.",true)}
    else if(now>before+1e-12)say("msg","손실함수의 값이 "+fmt(before,4)+"에서 "+fmt(now,4)+"로 커졌습니다.",true);
    else say("msg","가중치 "+(N*cur.W.length)+"개를 각각 접선의 기울기 반대쪽으로 옮겼습니다. 손실함수의 값 "+fmt(before,4)+" → "+fmt(now,4));
    renderAll();
  }
  function stepOne(){
    var eta=parseFloat($("eta").value),c=coef(cur.so,cur.sk),v=cur.W[cur.so][cur.sk],d=2*c.A*v+c.B,nw=v-eta*d,W=wSym();
    say("msg2",'<span class="m">'+W+' − <i>η</i><i>L</i>′('+W+') = '+fmt(v,3)+' − '+$("eta").value+' × ('+fmt(d,3)+') = '+fmt(nw,3)+'</span>');
    cur.W[cur.so][cur.sk]=nw;cur.steps++;record();renderAll();
  }
  function resetW(){
    stopAuto();cur.W=cur.W.map(function(){return zeros()});cur.steps=0;newHist();
    say("msg",cfg.single?"가중치가 모두 0이라 가중합이 모두 0이고, 모든 문장을 부정으로 판정합니다. 한 번 이동을 눌러 보세요.":"가중치가 모두 0이라 가중합이 모두 같고, 모든 제목을 스포츠로 판정합니다. 한 번 이동을 눌러 보세요.");
    say("msg2","");renderAll();
  }
  function selectW(o,k){cur.so=o;cur.sk=k;say("msg2","");renderSents();renderWbox();renderSel();if(foldOpen())startAnim()}
  function show(i,keepHash){
    stopAuto();animStop();ci=i;cfg=CH[i];VOC=cfg.voc;N=VOC.length;
    if(!S[i]){S[i]=fresh(cfg,i);cur=S[i];newHist()}
    cur=S[i];
    renderText();
    $("myText").value="";
    say("msg",cur.steps?"":"가중치가 모두 0입니다. 한 번 이동을 눌러 보세요.");say("msg2","");
    renderAll();
    if(foldOpen())startAnim();
    if(!keepHash){try{location.hash="ch"+(i+1)}catch(e){}}
  }
  function fromHash(){var m=/^#ch([12])$/.exec(location.hash||"");return m?+m[1]-1:0}

  // 이벤트
  window.addEventListener("hashchange",function(){var n=fromHash();if(n!==ci)show(n,true)});
  $("examples").addEventListener("click",function(e){var t=e.target.closest(".ex");if(!t)return;$("myText").value=t.textContent;cur.feed="mine";renderMine();renderSents();renderNet()});
  $("myText").addEventListener("input",function(){cur.feed="mine";renderMine();renderSents();renderNet()});
  $("wbox").addEventListener("click",function(e){var t=e.target.closest("[data-k]");if(t)selectW(+t.dataset.o,+t.dataset.k)});
  $("net").addEventListener("click",function(e){
    var t=e.target.closest("[data-k]");if(t){selectW(cur.so,+t.getAttribute("data-k"));return}
    t=e.target.closest("[data-o]");if(t)selectW(+t.getAttribute("data-o"),cur.sk);
  });
  $("sents").addEventListener("click",function(e){
    var t=e.target.closest("[data-del]");
    if(!t){var c=e.target.closest("[data-feed]");if(c){cur.feed=+c.dataset.feed;renderSents();renderNet()}return}
    stopAuto();cur.data.splice(+t.dataset.del,1);cur.feed=0;newHist();renderAll();
  });
  $("addBtns").addEventListener("click",function(e){
    var t=e.target.closest("[data-add]");if(!t)return;var tx=$("myText").value.trim();if(!tx)return;
    stopAuto();cur.data.push({text:tx,p:enc(tx),c:+t.dataset.add,base:false});cur.feed=cur.data.length-1;$("myText").value="";newHist();renderAll();
  });
  $("resetData").addEventListener("click",function(){stopAuto();cur.data=base(cfg);cur.feed=0;newHist();renderAll()});
  $("stepAll").addEventListener("click",function(){stopAuto();stepAll()});
  $("stepOne").addEventListener("click",function(){stopAuto();stepOne()});
  $("auto").addEventListener("click",function(){
    if(timer){stopAuto();return}
    $("auto").textContent="멈춤";var left=200;
    timer=setInterval(function(){if(left--<=0){stopAuto();return}stepAll()},150);
  });
  $("resetW").addEventListener("click",resetW);
  $("wRange").addEventListener("input",function(){
    stopAuto();cur.W[cur.so][cur.sk]=parseFloat(this.value);cur.hist[cur.hist.length-1]=loss();
    renderSents();renderWbox();renderStats();renderMine();drawHist();
    var c=coef(cur.so,cur.sk),v=cur.W[cur.so][cur.sk];$("vW").textContent=fmt(v,3);$("vD").textContent=fmt(2*c.A*v+c.B,3);drawChart(c);
  });
  document.querySelector(".fold").addEventListener("toggle",function(){if(this.open)startAnim();else animStop()});
  $("animPlay").addEventListener("click",function(){var A=ANIM;if(A.playing){animStop();renderAnim()}else if(A.done)startAnim();else{A.playing=true;renderAnim();A.t=setTimeout(animTick,500)}});
  $("animPrev").addEventListener("click",function(){var A=ANIM;animStop();if(A.done){A.done=false;A.k=DC.length-1;A.sub=0}else if(A.sub>0)A.sub=0;else if(A.k>0){A.k--;A.sub=0}renderAnim()});
  $("animNext").addEventListener("click",function(){var A=ANIM;animStop();if(A.done)return;if(A.sub<lastSub(A.k))A.sub++;else if(A.k<DC.length-1){A.k++;A.sub=0}else A.done=true;renderAnim()});
  $("animAll").addEventListener("click",function(){animStop();ANIM.done=true;renderAnim()});
  $("animSpeed").addEventListener("change",function(){SPEED=parseFloat(this.value)||1});
  function redraw(){drawChart(coef(cur.so,cur.sk));drawHist();drawAcc()}
  window.addEventListener("resize",redraw);
  try{
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",redraw);
    new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
  }catch(e){}
  show(fromHash(),true);
})();
</script>
</body>
</html>
