<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>이한이의 한글 야구장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 낮 경기 야구장 한 화면: 위 전광판(목표 글자) → 가운데 다이아몬드(공) → 아래 코치 말풍선 */
  color-scheme:light;
  --sky:#8fd6ff; --sky2:#d8f3ff;
  --grass:#3fae63; --grass2:#49ba6d; --deep:#12543a;
  --dirt:#e3ab6b; --ink:#17324d; --cream:#fffaf0;
  --stitch:#e5484d; --sun:#ffcf3f; --kid:#2563c9; --foe:#f2793b;
  --ui:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --glyph:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--sky),var(--sky2));color:var(--ink);font-family:var(--ui);
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
#app{position:relative;height:100%;max-width:520px;margin:0 auto}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:10px 12px 12px;gap:8px}
.screen.on{display:flex}

/* ---------- 홈 ---------- */
#home{overflow-y:auto;gap:12px;padding-top:16px}
.title{text-align:center;line-height:1.05}
.title small{display:block;font-size:20px;color:var(--kid)}
.title h1{margin:2px 0 0;font-size:clamp(34px,10.5vw,50px);font-weight:400;color:var(--ink);
  text-shadow:0 3px 0 #fff, 0 6px 0 rgba(23,50,77,.15)}
.hero{display:flex;justify-content:center;align-items:flex-end;gap:6px;height:84px}
.hero svg{width:78px;height:78px;animation:bob 1.6s ease-in-out infinite}
.hero .vs{font-size:22px;color:var(--stitch);padding-bottom:22px}
.hero .heroball{width:54px;height:54px;font-size:28px;position:relative;margin-bottom:8px;animation:bob 1.6s .4s ease-in-out infinite}
.pick{text-align:center;font-size:20px;color:var(--deep)}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stage{position:relative;border-radius:26px;padding:12px 10px 10px;color:#fff;text-align:center;
  box-shadow:0 7px 0 rgba(0,0,0,.2);transition:transform .08s}
.stage:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.stage .sb{position:relative;margin:0 auto 4px;width:72px;height:72px;font-size:36px}
.stage .nm{font-size:25px;line-height:1.1}
.stage .vs{font-size:15px;opacity:.95}
.stage .st{position:absolute;top:8px;right:10px;font-size:14px;background:rgba(0,0,0,.2);border-radius:99px;padding:2px 8px}
.s0{background:#f2793b}.s1{background:#2563c9}.s2{background:#8a4fd6}.s3{background:#d6336c}
.homebtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:auto}
.hb{background:#fff;border-radius:20px;padding:12px 4px;font-size:17px;box-shadow:0 5px 0 rgba(23,50,77,.18)}
.hb:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(23,50,77,.18)}
.hb b{display:block;font-size:26px;font-weight:400;line-height:1.1}

/* ---------- 공 ---------- */
.ball{display:grid;place-items:center;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 35% 28%,#fff 0,#fff 30%,#f1e7d3 100%);
  border:3px solid rgba(23,50,77,.25);box-shadow:0 6px 0 rgba(0,0,0,.2);
  font-family:var(--glyph);font-weight:900;color:var(--ink);line-height:1}
.ball::before,.ball::after{content:"";position:absolute;top:-12%;width:62%;height:124%;
  border:3px dashed var(--stitch);border-radius:50%;opacity:.7;pointer-events:none}
.ball::before{left:-46%}.ball::after{right:-46%}

/* ---------- 경기 화면 ---------- */
.hud{display:flex;align-items:stretch;gap:8px;flex:none}
.rbtn{flex:none;width:48px;border-radius:16px;background:#fff;font-size:15px;box-shadow:0 4px 0 rgba(23,50,77,.18);line-height:1.05}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(23,50,77,.18)}
.score{flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--ink);color:#fff;
  border-radius:16px;padding:4px 8px;min-width:0}
.team{display:flex;align-items:center;gap:6px;font-size:17px;min-width:0}
.team.r{justify-content:flex-end}
.team svg{width:34px;height:34px;flex:none}
.team .em{font-size:28px;line-height:1}
.team .pt{font-size:34px;color:var(--sun);font-variant-numeric:tabular-nums;min-width:22px;text-align:center}
.team .pt.pop{animation:pop .5s}
.mid{text-align:center;font-size:14px;line-height:1.15;padding:0 6px}
.mid .dots{display:flex;gap:4px;justify-content:center;align-items:center;margin-top:3px}
.mid .dots b{font-weight:400;font-size:12px;color:#ffb3b5;margin-right:2px}
.mid .dots i{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.22)}
.mid .dots.ab i.on{background:#fff}
.mid .dots i.bad{background:var(--stitch)}

#jumbo{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--deep);color:#fff;border-radius:22px;padding:6px 12px 8px;border:5px solid #0b3a28;
  box-shadow:inset 0 0 0 3px rgba(255,207,63,.55)}
#jlabel{font-size:18px;color:#c9f5d6}
#jmain{display:flex;align-items:center;gap:10px;font-family:var(--glyph);font-weight:900;line-height:1.05}
#jemoji{font-size:clamp(44px,13vw,60px)}
#jglyph{font-size:clamp(60px,19vw,88px);color:var(--sun);text-shadow:0 4px 0 rgba(0,0,0,.3)}
#jglyph.in{animation:pop .45s}
#jword{font-size:clamp(40px,12vw,56px);color:#fff;opacity:.85;margin-left:-6px}
#jear{display:none;font-size:clamp(56px,17vw,80px);line-height:1.1}
#jumbo.listen #jmain,#jumbo.listen .spk{display:none}
#jumbo.listen #jear{display:block;animation:pulse .9s ease-in-out infinite}
#count{position:absolute;left:8px;top:calc(8% + 8px);display:none;align-items:center;gap:5px;background:rgba(23,50,77,.85);color:#fff;border-radius:99px;padding:5px 10px;font-size:15px;z-index:4;pointer-events:none}
#count.on{display:flex}
#meter{position:absolute;left:7%;right:7%;top:66%;height:48px;border-radius:14px;background:rgba(23,50,77,.92);border:4px solid #fff;display:none;z-index:4;pointer-events:none;box-shadow:0 5px 0 rgba(0,0,0,.2)}
#meter.on{display:block}
#zone{position:absolute;top:4px;bottom:4px;border-radius:8px;background:#5fe07a;box-shadow:inset 0 0 0 3px #d9ffe1}
#meter.miss #zone{background:#ff8a8a}
#mbar{position:absolute;top:-8px;bottom:-8px;width:14px;margin-left:-7px;border-radius:7px;background:var(--sun);border:3px solid var(--ink)}
#speed{position:absolute;right:8px;top:calc(8% + 8px);display:none;background:var(--sun);color:var(--ink);border-radius:99px;padding:5px 10px;font-size:15px;z-index:4;pointer-events:none}
#speed.on{display:block}
#count i{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.25)}
#count i.on{background:var(--sun)}
.spk{position:absolute;right:8px;top:8px;background:var(--sun);color:var(--ink);font-size:15px;border-radius:99px;padding:5px 10px}

#field{--bs:clamp(62px,20vw,94px);position:relative;flex:1;min-height:0;overflow:hidden;border-radius:26px;
  border:5px solid #fff;background:var(--grass);box-shadow:0 6px 0 rgba(23,50,77,.15)}
#field.shake{animation:shake .35s}
.turf{position:absolute;inset:0;width:100%;height:100%}
.crowd{position:absolute;left:0;right:0;top:0;height:8%;background:#2a6fb3;
  background-image:radial-gradient(circle,#ffd66b 30%,transparent 32%),radial-gradient(circle,#ff8fa3 30%,transparent 32%),radial-gradient(circle,#fff 30%,transparent 32%);
  background-size:22px 14px,26px 16px,18px 12px;background-position:0 2px,9px 6px,4px 0;border-bottom:4px solid #fff}
.base{position:absolute;width:20px;height:20px;background:#fff;transform:translate(-50%,-50%) rotate(45deg);border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.plate{position:absolute;left:50%;top:88%;width:26px;height:22px;background:#fff;transform:translate(-50%,-50%);
  clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
.ring{position:absolute;left:50%;top:87%;width:calc(var(--bs)*1.25);height:calc(var(--bs)*1.25);border-radius:50%;
  transform:translate(-50%,-50%);border:6px dashed var(--sun);opacity:0;pointer-events:none}
.ring.on{opacity:1;animation:spin 3s linear infinite}
.fig{position:absolute;transform:translate(-50%,-50%);width:62px;height:62px;display:grid;place-items:center;font-size:50px;line-height:1;pointer-events:none}
.fig svg{width:62px;height:62px;display:block}
#batterFace{display:grid;place-items:center;width:62px;height:62px}
#pitcher{left:50%;top:50%}
#pitcher.wind{animation:wind .5s}
#batter{left:27%;top:83%}
#bat{position:absolute;left:74%;bottom:30%;width:11px;height:56px;border-radius:6px 6px 4px 4px;
  background:linear-gradient(#f3c98b,#b9773a);border:2px solid #7a4a1e;transform-origin:50% 100%;transform:rotate(-35deg)}
#bat.swing{animation:swing .32s ease-out}
#balls,#fx{position:absolute;inset:0;pointer-events:none}
.bw{position:absolute;width:var(--bs);height:var(--bs);transform:translate(-50%,-50%);pointer-events:auto}
.bw .ball{position:relative;width:100%;height:100%;font-size:calc(var(--bs)*.52)}
.bw.choice .ball{animation:popin .4s backwards, bob 1.8s .4s ease-in-out infinite}
.bw.fly .ball{animation:wob 1.6s ease-in-out infinite}
.bw.wrong{pointer-events:none}
.bw.wrong .ball{animation:nope .55s forwards}
.bw.gone{pointer-events:none;opacity:0;transition:opacity .3s}
.bw.pitch{pointer-events:none}
.glove{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--bs)*1.25);line-height:1;animation:popin .3s;pointer-events:none}
.runner{position:absolute;width:38px;height:38px;transform:translate(-50%,-70%);display:grid;place-items:center;font-size:30px;line-height:1;
  transition:left .36s linear,top .36s linear;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));pointer-events:none}
.runner svg{width:100%;height:100%}
.runner.in{animation:scorepop .45s forwards}
#banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(0);font-size:clamp(48px,16vw,84px);color:var(--sun);white-space:nowrap;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);pointer-events:none;z-index:5}
#banner.on{animation:banner 1.25s forwards}
#banner.red{color:#ff6b6b}
.conf{position:absolute;top:-6%;width:11px;height:16px;border-radius:3px;animation:fall linear forwards;pointer-events:none}
.star{position:absolute;font-size:26px;animation:burst .8s ease-out forwards;pointer-events:none;color:var(--sun)}

.coach{flex:none;display:flex;align-items:center;gap:10px;min-height:74px}
#msg{flex:1;background:#fff;border-radius:22px;padding:12px 14px;font-size:clamp(20px,6vw,26px);line-height:1.2;text-align:center;word-break:keep-all;
  box-shadow:0 5px 0 rgba(23,50,77,.15)}
#swingBtn{display:none;flex:none;width:44%;min-height:74px;border-radius:24px;background:var(--stitch);color:#fff;font-size:clamp(26px,8vw,34px);
  box-shadow:0 7px 0 #a82b30}
#swingBtn.on{display:block;animation:pulse .7s ease-in-out infinite}
#swingBtn:active{transform:translateY(5px);box-shadow:0 2px 0 #a82b30}

#inter{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:rgba(18,84,58,.93);color:#fff;z-index:20;text-align:center;border-radius:0}
#inter.on{display:flex}
#inter .ie{font-size:96px;line-height:1;animation:bob 1s ease-in-out infinite}
#inter .it{font-size:54px;color:var(--sun)}
#inter .is{font-size:26px}

/* ---------- 팝업 ---------- */
.modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(23,50,77,.6);z-index:30;padding:16px}
.modal.on{display:flex}
.card{position:relative;width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--cream);border-radius:30px;padding:20px 16px 16px;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.25);animation:popin .35s}
.card h2{margin:0 0 6px;font-size:36px;font-weight:400}
.big{display:block;width:100%;border-radius:22px;padding:15px;font-size:26px;color:#fff;background:var(--grass);box-shadow:0 6px 0 #2a7f47;margin-top:10px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #2a7f47}
.big.alt{background:#fff;color:var(--ink);box-shadow:0 6px 0 rgba(23,50,77,.18)}
.final{display:flex;justify-content:center;align-items:center;gap:14px;font-size:54px;margin:4px 0}
.final svg{width:54px;height:54px}.final span{font-size:44px;line-height:1}
.final b{font-weight:400;color:var(--stitch);font-variant-numeric:tabular-nums}
.newst{font-size:20px;margin-top:4px}
.newst i{display:block;font-style:normal;font-size:76px;line-height:1.1;animation:pop .8s .3s backwards}
.trophy{font-size:80px;line-height:1;animation:bob 1.2s ease-in-out infinite}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.grid i{font-style:normal;font-size:38px;aspect-ratio:1;display:grid;place-items:center;background:#fff;border-radius:18px;line-height:1}
.grid i.lock{color:#c7cfd8;background:#eef2f6;font-family:var(--ui)}
.setrow{text-align:left;margin-top:12px;font-size:19px}
.seg{display:flex;gap:6px;margin-top:5px}
.seg button{flex:1;background:#fff;border-radius:14px;padding:11px 4px;font-size:19px;box-shadow:0 3px 0 rgba(23,50,77,.15)}
.seg button.on{background:var(--kid);color:#fff}
.note{font-size:15px;color:#5b6b7b;margin-top:12px;line-height:1.35;font-family:var(--glyph);font-weight:700}

/* ---------- 글자 쓰기 ---------- */
#write .top{display:flex;gap:8px;align-items:stretch;flex:none}
.chips{flex:1;display:flex;gap:6px}
.chips button{flex:1;background:#fff;border-radius:16px;font-size:19px;padding:10px 2px;box-shadow:0 4px 0 rgba(23,50,77,.18)}
.chips button.on{background:var(--kid);color:#fff}
#pad{position:relative;flex:1;min-height:0;background:#fff;border-radius:26px;border:5px dashed #9cc7e6;overflow:hidden}
#guide{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--glyph);font-weight:900;font-size:min(62vw,46vh,330px);color:#dbe7f1;line-height:1}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#write .bot{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;flex:none}
#write .bot button{border-radius:20px;padding:15px 4px;font-size:22px;background:#fff;box-shadow:0 5px 0 rgba(23,50,77,.18)}
#write .bot button.go{background:var(--grass);color:#fff;box-shadow:0 5px 0 #2a7f47}
#write .bot button:active{transform:translateY(4px)}

@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes wob{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes popin{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes nope{0%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px);opacity:1}100%{transform:scale(.3);opacity:0}}
@keyframes swing{0%{transform:rotate(-35deg)}55%{transform:rotate(150deg)}100%{transform:rotate(-35deg)}}
@keyframes wind{50%{transform:translate(-50%,-62%) rotate(-18deg) scale(1.12)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes shake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,2px)}}
@keyframes banner{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg)}18%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}30%,78%{transform:translate(-50%,-50%) scale(1) rotate(-2deg);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes scorepop{to{transform:translate(-50%,-160%) scale(1.6);opacity:0}}
@keyframes pulse{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){
  #field.shake,.hero svg,.hero .heroball,.bw.choice .ball,.bw.fly .ball,#swingBtn.on,.trophy,#inter .ie{animation:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="kid" viewBox="0 0 64 64">
    <circle cx="32" cy="37" r="20" fill="#ffd8b0"/>
    <path d="M12 31a20 20 0 0 1 40 0z" fill="#2563c9"/>
    <path d="M44 25h15a3.5 3.5 0 0 1 0 7H44z" fill="#1b4fa8"/>
    <circle cx="32" cy="12" r="2.6" fill="#fff"/>
    <circle cx="30" cy="22" r="5.5" fill="#fff"/>
    <path d="M27.5 19.5v5M32.5 19.5v5M27.5 22h5" stroke="#2563c9" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="25" cy="39" r="2.7" fill="#17324d"/><circle cx="39" cy="39" r="2.7" fill="#17324d"/>
    <path d="M25 46q7 6.5 14 0" stroke="#17324d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="19.5" cy="44.5" r="3.2" fill="#ff9d9d" opacity=".75"/><circle cx="44.5" cy="44.5" r="3.2" fill="#ff9d9d" opacity=".75"/>
  </symbol>
</defs></svg>

<div id="app">

  <!-- 홈 -->
  <section id="home" class="screen on">
    <div class="title"><small>글자 공을 치고 달려요</small><h1>이한이의 한글 야구장</h1></div>
    <div class="hero">
      <svg><use href="#kid"/></svg>
      <div class="ball heroball">가</div>
      <div class="vs">대</div>
      <div style="font-size:66px;line-height:1.1">🐻</div>
    </div>
    <div class="pick">어떤 경기를 할까?</div>
    <div class="stages" id="stages"></div>
    <div class="homebtns">
      <button class="hb" id="btnWrite"><b>✏️</b>글자 쓰기</button>
      <button class="hb" id="btnBook"><b>⭐</b>스티커 북</button>
      <button class="hb" id="btnSet"><b>⚙️</b>어른 설정</button>
    </div>
  </section>

  <!-- 경기 -->
  <section id="game" class="screen">
    <div class="hud">
      <button class="rbtn" id="btnHome" aria-label="처음으로">🏠<br>처음</button>
      <div class="score">
        <div class="team"><svg><use href="#kid"/></svg><span>이한</span><span class="pt" id="ptKid">0</span></div>
        <div class="mid"><div id="inn">1회 초</div><div id="side">공격</div><div class="dots" id="dots"><b>아웃</b><i></i><i></i><i></i></div></div>
        <div class="team r"><span class="pt" id="ptFoe">0</span><span id="foeName">곰돌이</span><span class="em" id="foeEm">🐻</span></div>
      </div>
    </div>
    <button id="jumbo" aria-label="다시 듣기">
      <span id="jlabel">이 글자 공을 찾아라!</span>
      <span id="jear">🔊</span>
      <span id="jmain"><span id="jemoji"></span><b id="jglyph">가</b><span id="jword"></span></span>
      <span class="spk">🔊 듣기</span>
    </button>
    <div id="field">
      <svg class="turf" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <rect width="100" height="100" fill="#3fae63"/>
        <g fill="#49ba6d"><rect y="8" width="100" height="11.5"/><rect y="31" width="100" height="11.5"/><rect y="54" width="100" height="11.5"/><rect y="77" width="100" height="11.5"/></g>
        <path d="M50 88 L100 38 M50 88 L0 38" stroke="#fff" stroke-width=".9" opacity=".85"/>
        <polygon points="50,95 93,52 50,9 7,52" fill="#e3ab6b"/>
        <polygon points="50,81 79,52 50,23 21,52" fill="#49ba6d"/>
        <ellipse cx="50" cy="51" rx="10" ry="6" fill="#e3ab6b"/>
        <ellipse cx="50" cy="88" rx="14" ry="7" fill="#e3ab6b"/>

const vbuf={}; let vEl=null, vUrl=null, vNode=null, vTok=0;
function b64ab(b){ const t=atob(b), u=new Uint8Array(t.length); for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i); return u.buffer; }
function loadClip(k){ if(vbuf[k])return vbuf[k]; const a=AC(); if(!a||!VOICE[k])return Promise.resolve(null);
  return vbuf[k]=new Promise(res=>{ try{ const pr=a.decodeAudioData(b64ab(VOICE[k]),b=>res(b),()=>res(null)); if(pr&&pr.catch)pr.catch(()=>res(null)); }catch(e){res(null)} }); }
function wav(pcm,sr){ const n=pcm.length, dv=new DataView(new ArrayBuffer(44+n*2)); const w=(o,t)=>{for(let i=0;i<t.length;i++)dv.setUint8(o+i,t.charCodeAt(i))};
  w(0,'RIFF'); dv.setUint32(4,36+n*2,true); w(8,'WAVEfmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true); dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); w(36,'data'); dv.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){ const v=Math.max(-1,Math.min(1,pcm[i])); dv.setInt16(44+i*2,v*32767,true); } return new Blob([dv],{type:'audio/wav'}); }
function unlock(){ const a=AC(); if(vEl||!a)return; try{ vEl=new Audio(); vEl.setAttribute('playsinline',''); vEl.src=URL.createObjectURL(wav(new Float32Array(2400),24000)); const p=vEl.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){vEl=null}
  Object.keys(VOICE).forEach(loadClip); }
function stopVoice(){ try{ if(vEl)vEl.pause(); }catch(e){} try{ if(vNode)vNode.stop(); }catch(e){} vNode=null; }
async function say(seq){ if(!opt.voice||!seq)return; if(typeof seq==='string')seq=[seq]; unlock(); const a=AC(); if(!a)return; const tok=++vTok;
  const parts=await Promise.all(seq.map(x=>typeof x==='number'?x:loadClip(x))); if(tok!==vTok)return;
  const sr=a.sampleRate, len=p=>typeof p==='number'?Math.round(p/1000*sr):(p?p.length:0); let n=0; parts.forEach(p=>{n+=len(p)}); if(!n)return;
  const pcm=new Float32Array(n+Math.round(.06*sr)); let o=0; parts.forEach(p=>{ if(p&&typeof p!=='number')pcm.set(p.getChannelData(0),o); o+=len(p); });
  stopVoice();
  if(vEl){ try{ const url=URL.createObjectURL(wav(pcm,sr)); const old=vUrl; vUrl=url; vEl.src=url; if(old)URL.revokeObjectURL(old); await vEl.play(); return; }catch(e){ if(tok!==vTok)return; } }
  try{ const b=a.createBuffer(1,pcm.length,sr); b.getChannelData(0).set(pcm); const src=a.createBufferSource(); src.buffer=b; src.connect(a.destination); src.start(); vNode=src; }catch(e){} }
function hush(){ vTok++; stopVoice(); }

/* ---------- 화면 ---------- */
const field=$('#field'), ballsEl=$('#balls'), fx=$('#fx'), msg=$('#msg'), swingBtn=$('#swingBtn'), bat=$('#bat'), ring=$('#ring');
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); }
function coach(t){ msg.textContent=t; }
function banner(t,red){ const b=$('#banner'); b.textContent=t; b.style.fontSize=t.length>4?'clamp(34px,11vw,58px)':''; b.classList.remove('on'); b.classList.toggle('red',!!red); void b.offsetWidth; b.classList.add('on'); }
function shake(){ field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake'); }
function confetti(n){ const cols=['#ffcf3f','#e5484d','#2563c9','#ffffff','#8a4fd6','#f2793b'];
  for(let i=0;i<n;i++){ const c=document.createElement('div'); c.className='conf'; c.style.left=rnd(0,100)+'%'; c.style.background=cols[i%cols.length];
    c.style.animationDuration=rnd(1.4,2.8)+'s'; c.style.animationDelay=rnd(0,.5)+'s'; document.getElementById('app').appendChild(c); setTimeout(()=>c.remove(),3500); } }
function stars(x,y,n){ for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='star'; s.textContent='★'; s.style.left=x+'%'; s.style.top=y+'%';
    const a=Math.PI*2*i/n; s.style.setProperty('--dx',Math.cos(a)*90+'px'); s.style.setProperty('--dy',Math.sin(a)*90+'px'); fx.appendChild(s); setTimeout(()=>s.remove(),850); } }

/* ---------- 홈 ---------- */
function renderHome(){
  const box=$('#stages'); box.innerHTML='';
  STAGES.forEach((st,i)=>{ const b=document.createElement('button'); b.className='stage s'+i;
    const w=save.wins[st.id]||0;
    b.innerHTML=(w?'<span class="st">★ '+w+'</span>':'')+'<div class="ball sb">'+st.sample+'</div><div class="nm">'+st.name+'</div><div class="vs">'+st.foe.e+' '+st.foe.n+'와 경기</div>';
    b.addEventListener('click',()=>startGame(i)); box.appendChild(b); });
}

/* ---------- 경기 상태 ---------- */
let GID=0, S=null;
function hud(){
  $('#ptKid').textContent=S.kid; $('#ptFoe').textContent=S.foe;
  $('#inn').textContent=S.inning+'회 '+(S.half===0?'초':'말');
  $('#side').textContent=S.half===0?'이한 공격':'이한 투수';
  $('#dots').querySelectorAll('i').forEach((el,i)=>{ el.className=i<S.outs?'bad':''; });
  const c=$('#count'); c.classList.toggle('on',S.half===0&&(S.phase==='ready'||S.phase==='pitch'||S.phase==='repitch')); c.querySelectorAll('i').forEach((el,i)=>el.classList.toggle('on',i<(S.miss||0)));
  const sp=$('#speed'); sp.classList.toggle('on',S.half===0&&S.speed>100); sp.textContent='공 빠르기 '+S.speed+'%';
}
function bump(team){ const el=team==='kid'?$('#ptKid'):$('#ptFoe'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
function setFigures(){
  const foe=S.stage.foe.e;
  $('#pitcher').innerHTML = S.half===0 ? foe : KID;
  $('#batterFace').innerHTML = S.half===0 ? KID : foe;
  }
function clearBalls(){ ballsEl.innerHTML=''; fx.querySelectorAll('.glove').forEach(e=>e.remove()); ring.classList.remove('on'); swingBtn.classList.remove('on'); $('#meter').classList.remove('on'); }
function clearRunners(){ fx.querySelectorAll('.runner').forEach(e=>e.remove()); if(S)S.bases=[null,null,null]; }

function nextItem(){ if(!S.queue.length)S.queue=shuffle(S.stage.items); let it=S.queue.pop(); if(it===S.target&&S.queue.length)it=S.queue.pop(); return it; }
function makeChoices(target,n){ const others=shuffle(S.stage.items.filter(x=>x.g!==target.g)).slice(0,n-1); return shuffle([target].concat(others)); }
function listenOnly(){ return opt.voice && (opt.hide==='always' || (opt.hide==='late' && S.inning>=2)); }
function showTarget(){
  const t=S.target, hid=listenOnly()&&!S.reveal; $('#jumbo').classList.toggle('listen',hid);
  $('#jlabel').textContent = hid ? '소리를 잘 듣고 찾아봐! (누르면 다시 들려줘)' : S.half===0 ? '이 글자 공을 찾아라!' : '이 글자 공을 던져라!';
  $('#jemoji').textContent=t.e||''; const g=$('#jglyph'); g.textContent=t.g; g.classList.remove('in'); void g.offsetWidth; g.classList.add('in');
  $('#jword').textContent=t.w?t.w.slice(1):'';
}
function sayTarget(){
  const t=S&&S.target; if(!t)return; const tail='p_pick';
  say(t.w?['w_'+t.w,200,tail]:[t.s,300,t.s,200,tail]);
}
function wrongPick(w,again){ const it=w._item; S.wrongs++; sfx.bad(); w.classList.add('wrong'); coach('그건 "'+it.g+'"! 다시 찾아보자'); say(again?['p_that',40,it.s,220,'p_again']:['p_that',40,it.s]);
  if(S.wrongs>=2&&!S.reveal){ S.reveal=true; showTarget(); } }
function makeBall(item,cls){ const w=document.createElement('div'); w.className='bw '+cls; const b=document.createElement('button'); b.className='ball'; b.textContent=item.g; b.setAttribute('aria-label',item.s); w.appendChild(b); w._item=item; return w; }
const lanes=n=>n===2?[30,70]:n===3?[19,50,81]:[14,38,62,86];

async function startGame(i){
  unlock(); sfx.tap(); const g=++GID;
  S={stage:STAGES[i],idx:i,inning:1,half:0,kid:0,foe:0,bases:[null,null,null],outs:0,innRuns:0,speed:100,zone:14,sweep:1500,drops:0,miss:0,queue:[],target:null,phase:'idle'};
  $('#foeName').textContent=S.stage.foe.n; $('#foeEm').textContent=S.stage.foe.e;
  clearBalls(); clearRunners(); setFigures(); hud(); show('game');
  $('#jumbo').classList.remove('listen'); $('#jlabel').textContent='이 글자 공을 찾아라!'; $('#jglyph').textContent='⚾'; $('#jemoji').textContent=''; $('#jword').textContent='';
  coach('경기를 시작해요!'); banner('플레이 볼!'); say('p_play'); sfx.cheer();
  await wait(1500); if(g!==GID)return; startAtBat();
}
function goHome(){ GID++; hush(); if(S)S.phase='idle'; clearBalls(); clearRunners(); $('#inter').classList.remove('on'); $('#meter').className=''; document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on')); renderHome(); show('home'); }

/* ---------- 공격: 글자 고르기 → 타이밍 맞춰 치기 ---------- */
function startAtBat(){
  S.phase='choose'; S.firstTry=true; S.miss=0; S.wrongs=0; S.reveal=false; S.target=nextItem();
  clearBalls(); showTarget(); hud();
  const ch=makeChoices(S.target,opt.choices), xs=lanes(ch.length);
  ch.forEach((it,k)=>{ const w=makeBall(it,'choice'); w.style.left=xs[k]+'%'; w.style.top=(k%2?33:27)+'%'; w.firstChild.style.animationDelay=(k*.12)+'s, '+(.4+k*.2)+'s';
    w.addEventListener('pointerdown',e=>{e.stopPropagation();pickBall(w)}); ballsEl.appendChild(w); });
  coach(listenOnly()?'잘 듣고 글자 공을 콕 눌러 봐!':'같은 글자 공을 콕 눌러 봐!'); sayTarget();
}
async function pickBall(w){
  if(S.phase!=='choose')return; const g=GID, it=w._item;
  if(it.g!==S.target.g){ S.firstTry=false; S.speed=Math.min(300,S.speed+10); wrongPick(w,true); hud(); return; }
  S.phase='ready'; S.reveal=true; showTarget(); hud(); sfx.good(); stars(parseFloat(w.style.left),parseFloat(w.style.top),8);
  ballsEl.querySelectorAll('.bw').forEach(o=>{ if(o!==w)o.classList.add('gone'); });
  w.className='bw pitch'; w.style.transition='left .5s, top .5s, transform .5s';
  w.style.left='50%'; w.style.top='50%'; w.style.transform='translate(-50%,-50%) scale(.55)';
  S.pball=w; coach('딩동댕! 동그라미에서 휘둘러!'); say('p_swing');
  await wait(1700); if(g!==GID)return; pitch();
}
function pitch(){
  const g=GID, w=S.pball; S.phase='pitch'; S.swung=false; S.p=0; swingBtn.textContent='휘둘러!';
  const T=Math.max(500,[1800,2100,2400,2700][Math.min(S.miss,3)]*100/S.speed);
  S.assist=S.miss>=2; hud();
  w.style.transition='none'; ring.classList.add('on'); swingBtn.classList.add('on');
  const pt=$('#pitcher'); pt.classList.remove('wind'); void pt.offsetWidth; pt.classList.add('wind'); sfx.whoosh();
  const t0=performance.now()+350;
  (function frame(now){
    if(g!==GID||S.phase!=='pitch')return;
    const p=Math.max(0,(now-t0)/T); S.p=p;
    w.style.top=(50+48*p)+'%'; w.style.transform='translate(-50%,-50%) scale('+(.55+.7*p)+')';
    if(p>=1.1){ passed(); return; }
    requestAnimationFrame(frame);
  })(performance.now());
}
function swing(){
  if(!S||S.phase!=='pitch'||S.swung)return; S.swung=true;
  bat.classList.remove('swing'); void bat.offsetWidth; bat.classList.add('swing');
  const p=S.p, lo=S.assist?.48:.6, hi=S.assist?1.02:.95;
  if(p>=lo&&p<=hi){ hit(Math.abs(p-.78)<=.075); }
  else { sfx.whoosh(); coach(p<lo?'너무 빨랐어! 한 번 더!':'조금 늦었어! 한 번 더!'); }
}
async function passed(){
  const g=GID, w=S.pball; S.phase='repitch'; S.miss++; hud();
  ring.classList.remove('on'); swingBtn.classList.remove('on');
  if(S.miss>=3){ S.phase='out'; hud(); w.remove(); S.outs++; S.speed=Math.max(100,S.speed-10); hud(); sfx.bad();
    banner('삼진 아웃!',true); say('p_so'); coach('아웃! 괜찮아, 다음엔 칠 수 있어');
    await wait(3300); if(g!==GID)return; if(S.outs>=3)switchHalf(); else startAtBat(); return; }
  banner('스트라이크 '+S.miss+'!',true); say('p_strike'); coach('스트라이크 '+S.miss+'! 이제 '+(3-S.miss)+'번 남았어');
  w.style.transition='none'; w.style.top='50%'; w.style.transform='translate(-50%,-50%) scale(.55)';
  await wait(1700); if(g!==GID)return; coach(S.miss>=2?'천천히 던질게. 동그라미에서 휘둘러!':'공이 동그라미에 오면 휘둘러!'); pitch();
}
async function hit(perfect){
  const g=GID, w=S.pball; S.phase='hit'; hud(); ring.classList.remove('on'); swingBtn.classList.remove('on');
  let n=(perfect?3:1)+(S.firstTry?1:0);
  sfx.crack(); shake(); stars(50,86,10);
  w.style.transition='left .75s cubic-bezier(.2,.7,.3,1), top .75s cubic-bezier(.2,.7,.3,1), transform .75s';
  if(n===4){ w.style.left=rnd(20,80)+'%'; w.style.top='-25%'; } else { w.style.left=rnd(15,85)+'%'; w.style.top=rnd(12,30)+'%'; }
  w.style.transform='translate(-50%,-50%) scale(.3) rotate(540deg)';
  banner(HITNAME[n]); say('hit'+n); coach(n===4?'우와! 담장을 넘겼어!':'잘 쳤어! 달려 달려!'); if(S.speed<300)setTimeout(()=>{ if(g===GID&&S.phase==='hit')coach('다음 공은 더 빨라져!'); },1400);
  if(n===4){ sfx.fanfare(); confetti(46); } sfx.cheer();
  await wait(600); if(g!==GID)return;
  await runBases(n,'kid'); if(g!==GID)return;
  w.remove(); S.speed=Math.min(300,S.speed+20); hud();
  await wait(700); if(g!==GID)return;
  if(S.innRuns>=5){ banner('5점! 공수교대',false); coach('한 회에 5점! 대단해!'); sfx.cheer(); await wait(1500); if(g!==GID)return; switchHalf(); } else startAtBat();
}

/* ---------- 주자 ---------- */
function place(el,pos){ el.style.left=POS[pos][0]+'%'; el.style.top=POS[pos][1]+'%'; }
async function runBases(n,team){
  const g=GID; let rs=[]; S.bases.forEach((el,i)=>{ if(el)rs.push({el,pos:i+1}); });
  const r=document.createElement('div'); r.className='runner'; r.innerHTML=team==='kid'?KID:S.stage.foe.e; place(r,0); fx.appendChild(r); rs.push({el:r,pos:0});
  void r.offsetWidth;
  for(let k=0;k<n;k++){
    rs.forEach(x=>{ x.pos++; place(x.el,x.pos); }); sfx.step(); setTimeout(sfx.step,180);
    await wait(400); if(g!==GID)return;
    rs.filter(x=>x.pos>=4).forEach(x=>{ x.el.classList.add('in'); setTimeout(()=>x.el.remove(),460);
      if(team==='kid'){S.kid++;S.innRuns++;} else S.foe++; hud(); bump(team); sfx.score(); });
    rs=rs.filter(x=>x.pos<4);
  }
  S.bases=[null,null,null]; rs.forEach(x=>{ S.bases[x.pos-1]=x.el; });
}

/* ---------- 수비: 떨어지는 글자 공 잡기 ---------- */
function startFly(){
  S.phase='dchoose'; S.wrongs=0; S.reveal=false; S.target=nextItem(); clearBalls(); showTarget(); hud();
  const n=S.drops>=2?2:opt.choices, ch=makeChoices(S.target,n), xs=lanes(ch.length);
  ch.forEach((it,k)=>{ const w=makeBall(it,'choice'); w.style.left=xs[k]+'%'; w.style.top=(k%2?33:27)+'%'; w.firstChild.style.animationDelay=(k*.12)+'s, '+(.4+k*.2)+'s';
    w.addEventListener('pointerdown',e=>{e.stopPropagation();pickDef(w)}); ballsEl.appendChild(w); });
  coach(listenOnly()?'잘 듣고 던질 글자 공을 콕!':'같은 글자 공을 골라 던지자!'); sayTarget();
}
async function foeHit(text,seq,delay){
  const g=GID; S.phase='landed'; S.drops++; S.zone=Math.min(50,S.zone+5); S.reveal=true; showTarget();
  banner('안타!',true); coach(text); say(seq);
  await wait(delay); if(g!==GID)return; await runBases(1,'foe'); if(g!==GID)return;
  await wait(2300); if(g!==GID)return; startFly();
}
async function pickDef(w){
  if(S.phase!=='dchoose')return; const g=GID, it=w._item;
  ballsEl.querySelectorAll('.bw').forEach(o=>{ if(o!==w)o.classList.add('gone'); });
  if(it.g!==S.target.g){ sfx.bad(); w.classList.add('wrong'); foeHit('그건 "'+it.g+'"! '+S.stage.foe.n+' 안타',['p_that',40,it.s,350,'p_foehit2'],900); return; }
  S.phase='dready'; S.reveal=true; showTarget(); sfx.good(); stars(parseFloat(w.style.left),parseFloat(w.style.top),8);
  w.className='bw pitch'; w.style.transition='left .5s, top .5s, transform .5s';
  w.style.left='50%'; w.style.top='50%'; w.style.transform='translate(-50%,-50%) scale(.55)'; S.pball=w;
  coach('딩동댕! 초록 칸에서 던져!'); say('p_throw');
  await wait(1500); if(g!==GID)return; startMeter();
}
function startMeter(){
  const g=GID; S.phase='meter'; const zw=S.zone, zx=rnd(3,97-zw); S.zx=zx; S.zw=zw; S.mp=0;
  const z=$('#zone'), bar=$('#mbar'); z.style.left=zx+'%'; z.style.width=zw+'%'; bar.style.left='0%';
  $('#meter').classList.add('on'); swingBtn.textContent='던져!'; swingBtn.classList.add('on');
  const t0=performance.now()+250, per=S.sweep;
  (function frame(now){
    if(g!==GID||S.phase!=='meter')return;
    const ph=(Math.max(0,now-t0)/per)%2; S.mp=(ph<1?ph:2-ph)*100; bar.style.left=S.mp+'%';
    requestAnimationFrame(frame);
  })(performance.now());
}
async function throwBall(){
  if(!S||S.phase!=='meter')return; const g=GID, w=S.pball, ok=S.mp>=S.zx&&S.mp<=S.zx+S.zw; S.phase='thrown';
  swingBtn.classList.remove('on'); $('#meter').classList.add(ok?'hit':'miss');
  const pt=$('#pitcher'); pt.classList.remove('wind'); void pt.offsetWidth; pt.classList.add('wind'); sfx.whoosh();
  w.style.transition='top .42s ease-in, transform .42s ease-in'; w.style.top='88%'; w.style.transform='translate(-50%,-50%) scale(1.05)';
  await wait(330); if(g!==GID)return;
  bat.classList.remove('swing'); void bat.offsetWidth; bat.classList.add('swing');
  await wait(110); if(g!==GID)return;
  if(ok){
    sfx.glove(); sfx.good(); stars(50,86,10); S.outs++; S.sweep=Math.max(850,S.sweep*.94); hud();
    banner('스트라이크!',true); say('p_kout'); coach('스트라이크! 타자 아웃!'); sfx.cheer();
    await wait(1900); if(g!==GID)return; $('#meter').className=''; 
    if(S.outs>=3) switchHalf(); else startFly();
  } else {
    sfx.crack(); shake();
    w.style.transition='left .7s cubic-bezier(.2,.7,.3,1), top .7s cubic-bezier(.2,.7,.3,1), transform .7s';
    w.style.left=rnd(15,85)+'%'; w.style.top=rnd(12,30)+'%'; w.style.transform='translate(-50%,-50%) scale(.3) rotate(540deg)';
    setTimeout(()=>{ $('#meter').className=''; },900);
    foeHit('앗, 초록 칸을 벗어났어! '+S.stage.foe.n+' 안타','p_foehit2',600);
  }
}

/* ---------- 공수교대 / 끝 ---------- */
async function interlude(e,t,s,v){ const el=$('#inter'); $('#interE').innerHTML=e; $('#interT').textContent=t; $('#interS').textContent=s; el.classList.add('on'); say(v); sfx.good(); await wait(Array.isArray(v)?3400:2300); el.classList.remove('on'); }
async function switchHalf(){
  const g=GID; S.phase='idle'; clearBalls();
  if(S.half===0){ S.half=1; await interlude('⚾','공수교대!','이한이가 투수! 초록 칸에서 던져','p_change2'); }
  else { if(S.inning>=opt.innings){ endGame(); return; } S.inning++; S.half=0; const lo=listenOnly(); await interlude(lo?'👂':'⚾',S.inning+'회!',lo?'이제 소리만 듣고 찾아봐!':'다시 이한이 공격',lo?['p_attack',250,'p_listen']:'p_attack'); }
  if(g!==GID)return; clearRunners(); S.outs=0; S.innRuns=0; S.drops=0; S.miss=0; setFigures(); hud();
  if(S.half===0)startAtBat(); else startFly();
}
function endGame(){
  S.phase='idle'; hud(); clearBalls(); clearRunners();
  const win=S.kid>S.foe, tie=S.kid===S.foe;
  const st=STICKERS[save.stickers%STICKERS.length]; save.stickers++; if(win)save.wins[S.stage.id]=(save.wins[S.stage.id]||0)+1; persist();
  $('#rIcon').textContent=win?'🏆':tie?'🤝':'💪';
  $('#rTitle').textContent=win?'이한 팀 승리!':tie?'비겼어! 멋진 경기':'아깝다! 다음엔 이기자';
  $('#rKid').textContent=S.kid; $('#rFoe').textContent=S.foe; $('#rFoeEm').textContent=S.stage.foe.e; $('#rSticker').textContent=st;
  $('#mResult').classList.add('on'); confetti(win?70:30); sfx.fanfare(); sfx.cheer();
  say(win?'p_win':'p_end');
}

/* ---------- 스티커 북 / 설정 ---------- */
function openBook(){ sfx.tap(); const n=Math.min(save.stickers,STICKERS.length);
  $('#bookCount').textContent='모은 스티커 '+n+'개 / '+STICKERS.length+'개';
  $('#bookGrid').innerHTML=STICKERS.map((s,i)=>i<n?'<i>'+s+'</i>':'<i class="lock">?</i>').join(''); $('#mBook').classList.add('on'); }
const SETS=[{k:'choices',label:'한 번에 나오는 공',o:[[2,'2개'],[3,'3개'],[4,'4개']]},{k:'innings',label:'경기 길이',o:[[1,'1회'],[2,'2회'],[3,'3회']]},
  {k:'hide',label:'글자를 숨기고 소리만 듣고 찾기',o:[['never','안 함'],['late','후반 이닝'],['always','처음부터']]},
  {k:'voice',label:'목소리',o:[[true,'켜기'],[false,'끄기']]},{k:'sfx',label:'효과음',o:[[true,'켜기'],[false,'끄기']]}];
function renderSet(){ const body=$('#setBody'); body.innerHTML='';
  SETS.forEach(s=>{ const row=document.createElement('div'); row.className='setrow'; row.textContent=s.label; const seg=document.createElement('div'); seg.className='seg';
    s.o.forEach(([v,l])=>{ const b=document.createElement('button'); b.textContent=l; b.classList.toggle('on',opt[s.k]===v);
      b.addEventListener('click',()=>{ opt[s.k]=v; persist(); if(s.k==='voice'&&!v)hush(); renderSet(); sfx.tap(); }); seg.appendChild(b); });
    row.appendChild(seg); body.appendChild(row); }); }

/* ---------- 글자 쓰기 ---------- */
const WSETS=[{n:'모음',items:VOW},{n:'자음',items:CON},{n:'가나다',items:SYL}];
let wSet=2, wIdx=0, cv=$('#cv'), ctx=cv.getContext('2d'), drawing=false, hue=200;
function wItem(){ return WSETS[wSet].items[wIdx]; }
function sizeCv(){ const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1; cv.width=Math.max(1,r.width*d); cv.height=Math.max(1,r.height*d); ctx.setTransform(d,0,0,d,0,0); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=16; }
function wShow(speak){ $('#guide').textContent=wItem().g; sizeCv(); if(speak)say([wItem().s]); }
function renderChips(){ const c=$('#wChips'); c.innerHTML=''; WSETS.forEach((s,i)=>{ const b=document.createElement('button'); b.textContent=s.n; b.classList.toggle('on',i===wSet);
  b.addEventListener('click',()=>{ wSet=i; wIdx=0; renderChips(); wShow(true); sfx.tap(); }); c.appendChild(b); }); }
function xy(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); AC(); drawing=true; hue=(hue+47)%360; ctx.strokeStyle='hsl('+hue+' 85% 52%)'; const [x,y]=xy(e); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+.1,y+.1); ctx.stroke(); try{cv.setPointerCapture(e.pointerId)}catch(_){} });
cv.addEventListener('pointermove',e=>{ if(!drawing)return; const [x,y]=xy(e); ctx.lineTo(x,y); ctx.stroke(); });
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>{drawing=false}));
window.addEventListener('resize',()=>{ if($('#write').classList.contains('on'))sizeCv(); });

/* ---------- 연결 ---------- */
$('#btnHome').addEventListener('click',goHome);
$('#jumbo').addEventListener('click',()=>{ unlock(); sayTarget(); });
const act=()=>{ if(S&&S.phase==='meter')throwBall(); else swing(); };
field.addEventListener('pointerdown',act);
swingBtn.addEventListener('pointerdown',e=>{ e.preventDefault(); act(); });
$('#rAgain').addEventListener('click',()=>{ $('#mResult').classList.remove('on'); startGame(S.idx); });
$('#rHome').addEventListener('click',goHome);
$('#btnBook').addEventListener('click',openBook);
$('#btnSet').addEventListener('click',()=>{ sfx.tap(); renderSet(); $('#mSet').classList.add('on'); });
$('#btnWrite').addEventListener('click',()=>{ unlock(); sfx.tap(); show('write'); renderChips(); wShow(true); });
$('#wHome').addEventListener('click',goHome);
$('#wSay').addEventListener('click',()=>say([wItem().s]));
$('#wClear').addEventListener('click',()=>{ sfx.tap(); sizeCv(); });
$('#wNext').addEventListener('click',()=>{ sfx.good(); wIdx=(wIdx+1)%WSETS[wSet].items.length; wShow(true); });
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{ b.closest('.modal').classList.remove('on'); renderHome(); }));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('pointerdown',unlock,{once:true,capture:true});
renderHome();
})();
</script>
